<script>const DATA = {"items": [{"id": "board_meeting", "title": "Board Meeting (quarterly)", "what": "Hold a Board meeting. The law needs at least four in a year, with not more than 120 days between two meetings. Send notice at least 7 days before.", "law": "Companies Act 2013, Sec. 173; Secretarial Standard SS-1", "category": "board", "who": "CS", "rule": ["dates", [[6, 30, "quarter Apr-Jun {y}"], [9, 30, "quarter Jul-Sep {y}"], [12, 31, "quarter Oct-Dec {y}"], [3, 31, "quarter Jan-Mar {y1}"]]], "form": "Notice, agenda, notes on agenda, minutes", "applies_if": null, "penalty": "Every officer who fails to give notice of a Board meeting: Rs 25,000 (Sec. 173(4)).", "verify": "", "tip": "Circulate draft minutes within 15 days of the meeting; sign within 30 days (SS-1).", "period_fmt": "FY {fy}"}, {"id": "mbp1_dir8", "title": "Directors' disclosures (MBP-1 and DIR-8)", "what": "At the first Board meeting of the year collect from every director the notice of interest (MBP-1) and the declaration of non-disqualification (DIR-8).", "law": "Companies Act 2013, Sec. 184(1) and Sec. 164(2)", "category": "board", "who": "CS", "rule": ["dates", [[6, 30]]], "form": "MBP-1, DIR-8 (kept in records, not filed)", "applies_if": null, "penalty": "", "verify": "", "tip": "Also take fresh MBP-1 whenever a director's interests change. Update the Register of Contracts (MBP-4).", "period_fmt": "FY {fy}"}, {"id": "agm", "title": "Annual General Meeting", "what": "Hold the AGM within six months of the year end (by 30 September). Send the notice with the audited accounts and Board's report at least 21 clear days before.", "law": "Companies Act 2013, Sec. 96, 101, 129, 134, 136; SS-2", "category": "board", "who": "CS", "rule": ["dates", [[9, 30]]], "form": "AGM notice, explanatory statement, proxy form, attendance slip", "applies_if": null, "penalty": "Up to Rs 1 lakh on the company and officers, plus Rs 5,000 per day of default (Sec. 99).", "verify": "", "tip": "Book the Board meeting to approve accounts and Board's report early in August.", "period_fmt": "accounts of FY {pfy}"}, {"id": "posh_report", "title": "POSH annual report to District Officer", "what": "Internal Committee sends its annual report on sexual-harassment complaints for the calendar year to the employer and the District Officer (Ernakulam).", "law": "Sexual Harassment of Women at Workplace Act 2013, Sec. 21-22", "category": "board", "who": "HR / CS", "rule": ["dates", [[1, 31]]], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "Number of complaints received and disposed must also appear in the Board's report.", "period_fmt": "calendar year {y}"}, {"id": "msme1_h2", "title": "MSME-1 (dues to small suppliers, Oct-Mar)", "what": "Half-yearly return of amounts owed to micro and small enterprises for more than 45 days.", "law": "Sec. 405 Companies Act; MSMED Act 2006, Sec. 15", "category": "company", "who": "CS / Finance", "rule": ["dates", [[4, 30]]], "form": "MSME-1", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "Oct {py} - Mar {y}"}, {"id": "msme1_h1", "title": "MSME-1 (dues to small suppliers, Apr-Sep)", "what": "Half-yearly return of amounts owed to micro and small enterprises for more than 45 days.", "law": "Sec. 405 Companies Act; MSMED Act 2006, Sec. 15", "category": "company", "who": "CS / Finance", "rule": ["dates", [[10, 31]]], "form": "MSME-1", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "Apr - Sep {y}"}, {"id": "pas6_h2", "title": "PAS-6 (share capital reconciliation, Oct-Mar)", "what": "Half-yearly reconciliation of share capital audit report for unlisted public companies.", "law": "Companies (Prospectus and Allotment) Rules 2014, Rule 9A(8)", "category": "company", "who": "CS", "rule": ["dates", [[5, 30]]], "form": "PAS-6", "applies_if": "unlisted_public", "penalty": "", "verify": "", "tip": "Get the reconciliation report from a practising CS/CA first; RTA provides the data.", "period_fmt": "half-year to 31 Mar {y}"}, {"id": "pas6_h1", "title": "PAS-6 (share capital reconciliation, Apr-Sep)", "what": "Half-yearly reconciliation of share capital audit report for unlisted public companies.", "law": "Companies (Prospectus and Allotment) Rules 2014, Rule 9A(8)", "category": "company", "who": "CS", "rule": ["dates", [[11, 29]]], "form": "PAS-6", "applies_if": "unlisted_public", "penalty": "", "verify": "", "tip": "", "period_fmt": "half-year to 30 Sep {y}"}, {"id": "dpt3", "title": "DPT-3 (return of deposits / money not treated as deposit)", "what": "Annual return of deposits and of loans or money received that are not deposits, as on 31 March, with auditor's certificate.", "law": "Sec. 73; Companies (Acceptance of Deposits) Rules 2014, Rule 16 and 16A", "category": "company", "who": "CS / Finance", "rule": ["dates", [[6, 30]]], "form": "DPT-3", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "as on 31 Mar {y}"}, {"id": "dir3kyc", "title": "Director KYC (DIR-3 KYC)", "what": "KYC of every person holding a DIN.", "law": "Companies (Appointment and Qualification of Directors) Rules 2014, Rule 12A", "category": "company", "who": "CS", "rule": ["dates", [[6, 30]]], "form": "DIR-3 KYC / DIR-3 KYC-WEB", "applies_if": null, "penalty": "Rs 5,000 late fee and DIN is deactivated until filed.", "verify": "MCA amended Rule 12A in 2025 to move to a once-in-three-years KYC (due by 30 June) plus an update within 30 days of any change in mobile, e-mail or address. Confirm the current rule and which directors are due this year on the MCA portal.", "tip": "", "period_fmt": "FY {fy}"}, {"id": "cra2", "title": "CRA-2 (appointment of Cost Auditor)", "what": "Intimate appointment of cost auditor: within 30 days of the Board meeting that appoints them, or within 180 days of the start of the year, whichever is earlier.", "law": "Sec. 148; Companies (Cost Records and Audit) Rules 2014, Rule 6", "category": "company", "who": "CS", "rule": ["fy_start_plus", 179], "form": "CRA-2", "applies_if": "cost_audit", "penalty": "", "verify": "", "tip": "Healthcare services are covered by the Cost Rules above the turnover thresholds - confirm with the cost auditor.", "period_fmt": "FY {fy}"}, {"id": "aoc4", "title": "AOC-4 (financial statements to RoC)", "what": "File the audited financial statements (and AOC-4 CFS if there is a subsidiary / associate) within 30 days of the AGM.", "law": "Companies Act 2013, Sec. 137", "category": "company", "who": "CS", "rule": ["agm_plus", 30], "form": "AOC-4 / AOC-4 XBRL / AOC-4 CFS", "applies_if": null, "penalty": "Additional fee of Rs 100 per day; penalty on company and officers under Sec. 137(3).", "verify": "", "tip": "XBRL filing applies to companies with paid-up capital of Rs 5 crore or more, or turnover of Rs 100 crore or more.", "period_fmt": "accounts of FY {pfy}"}, {"id": "csr2", "title": "CSR-2 (CSR report)", "what": "Report on Corporate Social Responsibility spent for the year, filed with or after AOC-4.", "law": "Sec. 135; Companies (CSR Policy) Rules 2014, Rule 12(1A)", "category": "company", "who": "CS", "rule": ["agm_plus", 30], "form": "CSR-2", "applies_if": "csr", "penalty": "", "verify": "", "tip": "Unspent amount on ongoing projects must go to the Unspent CSR Account within 30 days of year end.", "period_fmt": "FY {pfy}"}, {"id": "adt1", "title": "ADT-1 (auditor appointment)", "what": "Intimate appointment / re-appointment of the statutory auditor within 15 days of the AGM (only in a year when the auditor is appointed).", "law": "Companies Act 2013, Sec. 139", "category": "company", "who": "CS", "rule": ["agm_plus", 15], "form": "ADT-1", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "AGM {y}"}, {"id": "mgt7", "title": "MGT-7 (Annual Return)", "what": "File the Annual Return within 60 days of the AGM. A copy must also be placed on the website.", "law": "Companies Act 2013, Sec. 92", "category": "company", "who": "CS", "rule": ["agm_plus", 60], "form": "MGT-7 (MGT-8 certification if paid-up >= Rs 10 cr or turnover >= Rs 50 cr)", "applies_if": null, "penalty": "Additional fee of Rs 100 per day; penalty under Sec. 92(5).", "verify": "", "tip": "", "period_fmt": "FY {pfy}"}, {"id": "cra4", "title": "CRA-4 (cost audit report)", "what": "File the cost audit report within 30 days of receiving it from the cost auditor (cost auditor must give it within 180 days of year end).", "law": "Companies (Cost Records and Audit) Rules 2014, Rule 6(6)", "category": "company", "who": "CS", "rule": ["fy_start_plus", 209], "form": "CRA-4 (XBRL)", "applies_if": "cost_audit", "penalty": "", "verify": "", "tip": "", "period_fmt": "FY {pfy}"}, {"id": "mr3", "title": "Secretarial Audit Report (MR-3)", "what": "Secretarial audit by a practising Company Secretary; report is annexed to the Board's report.", "law": "Companies Act 2013, Sec. 204", "category": "company", "who": "CS", "rule": ["dates", [[8, 15]]], "form": "MR-3 (annexed to Board's report)", "applies_if": "secretarial_audit", "penalty": "", "verify": "", "tip": "Target date: get the report before the Board meeting that approves the Board's report. Applies to public companies with paid-up capital >= Rs 50 cr, turnover >= Rs 250 cr, or borrowings >= Rs 100 cr.", "period_fmt": "FY {pfy}"}, {"id": "fla", "title": "FLA Return (Foreign Liabilities and Assets)", "what": "Annual return to RBI of foreign investment received / made, as on 31 March.", "law": "FEMA 1999; Master Direction - Reporting under FEMA", "category": "fema", "who": "CS / Finance", "rule": ["dates", [[7, 15]]], "form": "FLA return on RBI FLAIR portal", "applies_if": "foreign_investment", "penalty": "Late submission is a contravention; compounding / late submission fee applies.", "verify": "", "tip": "", "period_fmt": "as on 31 Mar {y}"}, {"id": "bmw_annual", "title": "Bio-Medical Waste annual report", "what": "Annual report (Form IV) to the Kerala State Pollution Control Board on bio-medical waste generated and disposed.", "law": "Bio-Medical Waste Management Rules 2016, Rule 13", "category": "hospital", "who": "Infection Control / Admin", "rule": ["dates", [[6, 30]]], "form": "Form IV", "applies_if": null, "penalty": "", "verify": "", "tip": "Also put the annual report on the hospital website.", "period_fmt": "calendar year {py}"}, {"id": "pcpndt_formf", "title": "PCPNDT monthly report", "what": "Send the monthly report of ultrasound procedures (Form F records) to the Appropriate Authority.", "law": "PC&PNDT Act 1994; PC&PNDT Rules 1996, Rule 9(8)", "category": "hospital", "who": "Radiology / Obstetrics", "rule": ["monthly", 5], "form": "", "applies_if": "pcpndt", "penalty": "Record-keeping lapses are treated as offences under the Act - registration can be suspended.", "verify": "", "tip": "", "period_fmt": "FY {fy}"}, {"id": "tds_deposit", "title": "TDS / TCS payment", "what": "Deposit tax deducted at source in the previous month (March deductions: by 30 April).", "law": "Income-tax Act 2025 and Rules (earlier Income-tax Act 1961, Sec. 200)", "category": "tax_labour", "who": "Finance", "rule": ["monthly", 7], "form": "", "applies_if": null, "penalty": "", "verify": "The Income-tax Act 2025 replaced the 1961 Act from 1 April 2026. Section numbers changed; confirm due dates with the tax team.", "tip": "", "period_fmt": "FY {fy}"}, {"id": "pf_esi", "title": "PF and ESI contributions", "what": "Pay Provident Fund and ESI contributions for the previous month.", "law": "Code on Social Security 2020 (in force from 21 Nov 2025)", "category": "tax_labour", "who": "HR / Finance", "rule": ["monthly", 15], "form": "", "applies_if": null, "penalty": "", "verify": "The four Labour Codes came into force on 21 November 2025. Check the new registers and returns.", "tip": "", "period_fmt": "FY {fy}"}, {"id": "gstr1", "title": "GSTR-1 (outward supplies)", "what": "Monthly GST return of outward supplies (pharmacy, canteen, rentals and other taxable supplies).", "law": "CGST Act 2017, Sec. 37", "category": "tax_labour", "who": "Finance", "rule": ["monthly", 11], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "Most healthcare services to patients are exempt, but pharmacy sales to outsiders, rentals and food are not.", "period_fmt": "FY {fy}"}, {"id": "gstr3b", "title": "GSTR-3B (GST payment)", "what": "Monthly summary GST return and tax payment.", "law": "CGST Act 2017, Sec. 39", "category": "tax_labour", "who": "Finance", "rule": ["monthly", 20], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "FY {fy}"}, {"id": "tds_return", "title": "TDS quarterly statements", "what": "Quarterly TDS statements (salary and non-salary).", "law": "Income-tax Act 2025 and Rules", "category": "tax_labour", "who": "Finance", "rule": ["dates", [[7, 31, "quarter Apr-Jun {y}"], [10, 31, "quarter Jul-Sep {y}"], [1, 31, "quarter Oct-Dec {y}"], [5, 31, "quarter Jan-Mar {y}"]]], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "The 31 May date is for the January-March quarter of the year just ended.", "period_fmt": "FY {fy}"}, {"id": "advance_tax", "title": "Advance tax instalment", "what": "Advance income tax instalments (15%, 45%, 75%, 100%).", "law": "Income-tax Act 2025", "category": "tax_labour", "who": "Finance", "rule": ["dates", [[6, 15, "1st instalment"], [9, 15, "2nd instalment"], [12, 15, "3rd instalment"], [3, 15, "4th instalment"]]], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "FY {fy}"}, {"id": "itr", "title": "Income tax return and tax audit", "what": "Company income tax return with tax audit report.", "law": "Income-tax Act 2025", "category": "tax_labour", "who": "Finance", "rule": ["dates", [[10, 31]]], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "Tax audit report is due one month before the return (30 September).", "period_fmt": "FY {pfy}"}, {"id": "gstr9", "title": "GSTR-9 / 9C (GST annual return)", "what": "GST annual return and reconciliation statement for the previous year.", "law": "CGST Act 2017, Sec. 44", "category": "tax_labour", "who": "Finance", "rule": ["dates", [[12, 31]]], "form": "", "applies_if": null, "penalty": "", "verify": "", "tip": "", "period_fmt": "FY {pfy}"}], "categories": {"company": "Company Law (MCA / RoC)", "board": "Board & Meetings", "fema": "Foreign Investment (RBI / FEMA)", "hospital": "Hospital Regulators", "tax_labour": "Tax, GST & Labour (with Finance / HR)"}, "flags": {"unlisted_public": "Unlisted public company", "listed": "Shares listed on a stock exchange", "foreign_investment": "Has foreign shareholding / FDI", "csr": "CSR applies (Section 135)", "cost_audit": "Cost audit applies", "secretarial_audit": "Secretarial audit applies (Section 204)", "pcpndt": "Has ultrasound / imaging registered under PCPNDT Act", "track_tax_labour": "Also show tax, GST and labour due dates (handled by Finance / HR)"}, "events": [{"id": "director_appointed", "title": "A new Director or Key Managerial Person joins", "steps": ["Take consent (DIR-2) and declaration of non-disqualification (DIR-8) before appointment; check DIN is active.", "Pass Board resolution (additional director / KMP); for independent directors take Sec. 149(7) declaration and check the IICA databank registration.", "File DIR-12 with the RoC within 30 days of appointment.", "Take MBP-1 disclosure of interest at the first Board meeting attended.", "Update Register of Directors and KMP; issue appointment letter (independent directors: letter as per Schedule IV).", "Regularise additional director at the next AGM (shareholders' resolution; MGT-14 not needed for ordinary resolution).", "If there is foreign shareholding and the director is a foreign national, check FEMA / security clearance requirements."], "law": "Sec. 152, 161, 168, 170, 203; Rules 8 & 18 of Appointment Rules"}, {"id": "director_resigns", "title": "A Director resigns or leaves", "steps": ["Receive resignation letter; place it before the Board and note it in minutes.", "File DIR-12 within 30 days of receipt of resignation.", "Director may file DIR-11 themselves within 30 days (optional).", "For an independent director, record the detailed reasons; appoint a replacement within 3 months (if required by Sec. 149).", "Update Register of Directors; check if the Board / committee composition still meets the minimum.", "Revoke bank / signing authorities and inform the bankers."], "law": "Sec. 168; Rule 15 of Appointment Rules"}, {"id": "special_resolution", "title": "A Special Resolution (or certain Board resolutions) is passed", "steps": ["File MGT-14 within 30 days of passing the resolution with a certified true copy and explanatory statement.", "Board resolutions needing MGT-14 include approval of accounts and Board's report, borrowing, and investment decisions listed in Sec. 179(3) (private companies are exempt for some).", "Record the resolution in the minutes book and update any registers affected."], "law": "Sec. 117, 179(3)"}, {"id": "charge", "title": "A bank loan is taken or security (charge) is created / modified / repaid", "steps": ["Check borrowing is within Sec. 180(1)(c) limit approved by shareholders (special resolution) and Board approval under Sec. 179(3)(d).", "File CHG-1 within 30 days of creating or modifying the charge (late filing is allowed within the further periods in Sec. 77 with additional / ad valorem fees).", "On full repayment, file CHG-4 within 30 days with the lender's no-dues letter.", "Update the Register of Charges (CHG-7) and keep a copy of the instrument.", "Check stamp duty on the loan and security documents under the Kerala Stamp Act."], "law": "Sec. 77-87; Companies (Registration of Charges) Rules 2014"}, {"id": "share_allotment", "title": "Shares are issued / allotted (including to a foreign investor)", "steps": ["Get shareholder approval (special resolution for preferential / private placement under Sec. 42 & 62(1)(c)); file MGT-14 within 30 days.", "Obtain valuation report where required; issue offer letter PAS-4 and keep record of offer PAS-5.", "Receive money only in a separate bank account; allot within 60 days of receipt.", "File PAS-3 (return of allotment) within 15 days of allotment.", "Credit shares in demat form (unlisted public companies must issue securities only in demat).", "If the investor is foreign: file FC-GPR on the RBI FIRMS portal within 30 days of allotment; check sectoral cap (hospitals: 100% automatic route).", "Update the Register of Members (MGT-1)."], "law": "Sec. 39, 42, 62; FEMA (Non-debt Instruments) Rules 2019"}, {"id": "share_transfer", "title": "Shares are transferred between shareholders", "steps": ["For demat shares, transfer happens through the depository; for any physical share, use SH-4 (physical transfer of shares of unlisted public companies is restricted - check Rule 9A).", "If a foreign party buys from / sells to an Indian resident, file FC-TRS within 60 days of receipt / remittance of money; follow pricing guidelines.", "Check for significant beneficial owner changes (BEN-1 / BEN-2) and update registers."], "law": "Sec. 56; Rule 9A; FEMA NDI Rules"}, {"id": "sbo", "title": "Change in Significant Beneficial Owner (SBO)", "steps": ["Receive BEN-1 declaration from the SBO.", "File BEN-2 with the RoC within 30 days of receipt of BEN-1.", "Update the Register of Significant Beneficial Owners (BEN-3)."], "law": "Sec. 90; Companies (Significant Beneficial Owners) Rules 2018"}, {"id": "rpt", "title": "A contract with a related party (group company, director, their relatives)", "steps": ["Check if it is in the ordinary course of business and at arm's length; if not, Board approval under Sec. 188 is needed; above thresholds, shareholders' approval (ordinary resolution, related party not voting).", "Audit Committee approval (if the company has one) under Sec. 177.", "Interested director must disclose interest (MBP-1) and not take part.", "Enter in Register of Contracts (MBP-4); disclose in Board's report (AOC-2).", "For transactions with the foreign parent / group, check transfer pricing and FEMA."], "law": "Sec. 184, 188, 177; Rule 15 of Meetings of Board Rules"}, {"id": "auditor_resigns", "title": "Statutory auditor resigns / casual vacancy", "steps": ["Auditor files ADT-3 within 30 days of resignation.", "Board fills casual vacancy within 30 days; shareholders approve within 3 months (Sec. 139(8)).", "File ADT-1 for the new auditor within 15 days."], "law": "Sec. 139(8), 140(2)"}, {"id": "registered_office", "title": "Registered office is shifted", "steps": ["Within the same city: Board resolution; file INC-22 within 30 days.", "To another city in Kerala: special resolution + MGT-14 + INC-22.", "To another state: special resolution, approval of Regional Director (INC-23), alteration of MOA.", "Change address on letterhead, website, licences, GST, PAN / TAN and bank records."], "law": "Sec. 12, 13"}, {"id": "legal_notice", "title": "A legal notice is received (e.g. alleging medical negligence)", "steps": ["Note the date of receipt and the reply deadline; open a file and inform the Medical Director / unit head.", "Intimate the professional indemnity / medical malpractice insurer at once - most policies need prompt notice.", "Collect and secure the complete medical records (do not alter them; keep audit trail of the electronic record).", "Get a factual note from the treating doctors and nursing staff.", "Draft a reply through advocates (use 'Write a document > Reply to legal notice'); do not admit liability.", "If the patient asks for records, provide copies within 72 hours as per NMC / IMC regulations, with acknowledgement."], "law": "Consumer Protection Act 2019; Bharatiya Nyaya Sanhita 2023, Sec. 106; NMC / IMC (Professional Conduct) Regulations"}, {"id": "consumer_case", "title": "A case is filed in the Consumer Commission", "steps": ["Written version must be filed within 30 days of receiving notice, extendable by up to 15 days only - after 45 days the right to file is lost.", "Engage an advocate; share medical records, expert opinion, consent forms and bills.", "Inform the indemnity insurer and the concerned doctors (they may be joined as parties).", "Keep a case diary with hearing dates."], "law": "Consumer Protection Act 2019, Sec. 35 & 38"}, {"id": "data_breach", "title": "Patient data leak, cyber attack or ransomware", "steps": ["Report the cyber incident to CERT-In within 6 hours of noticing it.", "Inform the Data Protection Board of India and each affected patient without delay; send a detailed report to the Board within 72 hours (DPDP Rules 2025).", "Preserve logs (180 days is required by CERT-In) and evidence; involve IT security and legal counsel.", "Inform the insurer if there is a cyber policy; brief the Board / Chairman.", "Record the incident, root cause and remedial steps."], "law": "IT Act 2000 Sec. 70B; CERT-In Directions 2022; DPDP Act 2023 & DPDP Rules 2025", "verify": "DPDP Rules 2025 came into force in phases; confirm which obligations are already in force."}, {"id": "new_equipment", "title": "New radiology / radiation / ultrasound equipment is installed", "steps": ["AERB: obtain procurement permission / registration / licence on the eLORA portal before use (X-ray, CT, cath lab, radiotherapy, nuclear medicine).", "Designate a Radiological Safety Officer; arrange personnel dosimeters (TLD).", "Ultrasound: apply to the PCPNDT Appropriate Authority to add the machine to the registration, at least 30 days before any change.", "Update the Licences & Renewals register in this tool."], "law": "Atomic Energy (Radiation Protection) Rules 2004; PC&PNDT Rules 1996, Rule 13"}, {"id": "new_service", "title": "Starting a new service (transplant, blood centre, IVF, dialysis, pharmacy etc.)", "steps": ["Organ transplant: registration under the Transplantation of Human Organs and Tissues Act (renewed every 5 years); hospital-based Authorisation Committee; K-SOTTO / KNOS registration.", "Blood centre: licence from the State Drugs Controller and CDSCO under Drugs & Cosmetics Rules.", "IVF / ART: registration under the ART (Regulation) Act 2021 with the National / State Registry.", "Pharmacy: retail drug licence (Form 20 / 21); NDPS - Recognised Medical Institution approval for morphine and other essential narcotic drugs.", "Psychiatry in-patient: registration with the State Mental Health Authority under the Mental Healthcare Act 2017.", "Update Kerala Clinical Establishments registration and the rate display, and add to NABH scope."], "law": "THOTA 1994; Drugs & Cosmetics Act 1940; ART Act 2021; NDPS Act 1985; MHCA 2017; Kerala Clinical Establishments Act 2018"}, {"id": "govt_notice", "title": "A notice is received from RoC / MCA, RBI, tax or any regulator", "steps": ["Note the date of receipt, the section invoked and the reply date. Ask for time in writing if needed.", "Check the facts from the filings / records; identify any genuine default.", "For a genuine default, consider compounding (Sec. 441) or adjudication (Sec. 454) before the matter escalates.", "Draft a reply (use 'Check a document' to analyse the notice first) and place the matter before the Board if material."], "law": "Companies Act 2013, Sec. 206, 441, 454"}], "licences": [{"name": "Kerala Clinical Establishments permanent registration", "authority": "District Registering Authority"}, {"name": "PCPNDT registration (ultrasound)", "authority": "PCPNDT Appropriate Authority, Ernakulam"}, {"name": "AERB licences - X-ray / CT / Cath lab / Radiotherapy", "authority": "AERB (eLORA)"}, {"name": "Organ transplant registration (THOTA)", "authority": "Appropriate Authority, Govt. of Kerala"}, {"name": "Blood centre licence", "authority": "State Drugs Controller / CDSCO"}, {"name": "Retail pharmacy drug licences (Form 20/21)", "authority": "State Drugs Controller"}, {"name": "NDPS - Recognised Medical Institution", "authority": "State Drugs Controller"}, {"name": "Bio-Medical Waste authorisation", "authority": "Kerala State Pollution Control Board"}, {"name": "Consent to Operate (Air & Water Acts)", "authority": "Kerala State Pollution Control Board"}, {"name": "Fire NOC", "authority": "Kerala Fire & Rescue Services"}, {"name": "Lift licences", "authority": "Electrical Inspectorate, Kerala"}, {"name": "Boiler certificate", "authority": "Factories & Boilers Department"}, {"name": "Diesel generator / HT installation approval", "authority": "Electrical Inspectorate, Kerala"}, {"name": "FSSAI licence (kitchen / canteen)", "authority": "Food Safety Department"}, {"name": "Legal Metrology stamping (weighing machines)", "authority": "Legal Metrology Department"}, {"name": "Ethics Committee registration (clinical trials)", "authority": "CDSCO / DHR"}, {"name": "NABH accreditation", "authority": "NABH"}, {"name": "NABL accreditation (laboratory)", "authority": "NABL"}, {"name": "Insurance empanelments (CGHS / ECHS / KASP-PMJAY / TPAs)", "authority": "Respective agencies"}, {"name": "Professional indemnity insurance policy", "authority": "Insurer"}, {"name": "Trade licence / D&O licence", "authority": "Local body (Corporation / Panchayat)"}], "draftTypes": [{"id": "board_notice", "group": "Board & Shareholders", "title": "Notice and Agenda for a Board Meeting", "questions": [["meeting_no", "Meeting number (e.g. 143rd)", "text"], ["date_time", "Date, time and place (or video conference)", "text"], ["agenda", "Agenda items - one per line", "textarea"]], "guidance": "Draft the notice (SS-1: at least 7 days, mention VC facility), the agenda with standard opening items (leave of absence, confirmation of previous minutes, action taken report, noting of committee minutes, disclosures), and a short note on each agenda item with the draft resolution and the section it is passed under."}, {"id": "board_resolution", "group": "Board & Shareholders", "title": "Board Resolution / Certified True Copy", "questions": [["subject", "What is being approved?", "textarea"], ["meeting", "Meeting at which it was / will be passed (number and date)", "text"], ["authorised", "Who is authorised to act on it (names and designations)", "text"]], "guidance": "Give the resolution in 'RESOLVED THAT ... RESOLVED FURTHER THAT ...' form, citing the correct section. Then give it as a Certified True Copy signed by the CS / a director. State if MGT-14 is needed."}, {"id": "circular_resolution", "group": "Board & Shareholders", "title": "Resolution by Circulation", "questions": [["subject", "What is being approved?", "textarea"], ["directors", "Names of directors it will be sent to", "textarea"]], "guidance": "Follow Sec. 175 and SS-1: covering note, draft resolution with explanatory note, approval / dissent form for each director, and the note that it will be noted at the next Board meeting. Mention matters that cannot be passed by circulation."}, {"id": "minutes", "group": "Board & Shareholders", "title": "Minutes of a Board / Committee Meeting (from rough notes)", "questions": [["meeting", "Which meeting (Board / committee, number, date, time, place)", "text"], ["present", "Directors and invitees present; leave of absence", "textarea"], ["notes", "Your rough notes of what was discussed and decided", "textarea"]], "guidance": "Write minutes in SS-1 format: heading, attendance, chairperson, quorum, each item with a brief record of discussion and the resolution passed, interested directors not participating, and close of meeting. Past tense, third person, no verbatim debate."}, {"id": "agm_notice", "group": "Board & Shareholders", "title": "Notice of AGM / EGM with Explanatory Statement", "questions": [["meeting", "AGM or EGM, number, date, time and mode (physical / VC)", "text"], ["business", "Business items - ordinary and special", "textarea"]], "guidance": "Follow Sec. 101-102 and SS-2: notice, ordinary and special business with draft resolutions, explanatory statement under Sec. 102 for special business with the disclosure of interest, notes (proxy, e-voting if applicable, book closure / record date, VC instructions)."}, {"id": "board_report", "group": "Board & Shareholders", "title": "Section of the Board's Report", "questions": [["section", "Which section (e.g. CSR, RPT, risk, POSH, deposits, particulars of loans)", "text"], ["facts", "Facts and figures for the year", "textarea"]], "guidance": "Draft the section to meet Sec. 134(3) and the Companies (Accounts) Rules 2014, Rule 8."}, {"id": "roc_reply", "group": "Board & Shareholders", "title": "Letter to RoC / MCA / Regulator (reply to a notice)", "questions": [["to", "To whom (office and address)", "text"], ["ref", "Notice reference and date", "text"], ["facts", "What the notice says and our facts", "textarea"]], "guidance": "Formal reply: reference, brief facts, point-by-point response, documents enclosed, request for personal hearing if useful. Measured tone; admit nothing that is not a fact."}, {"id": "nda", "group": "Contracts", "title": "Non-Disclosure Agreement (NDA)", "questions": [["other_party", "Other party - full legal name and address", "text"], ["kind", "Mutual, or only one side shares information? Which side?", "text"], ["purpose", "Why is information being shared? (purpose)", "textarea"], ["term", "How long should it last?", "text"]], "guidance": "Standard Indian NDA: definitions (include patient data, clinical protocols, pricing, tariffs, business plans), exclusions, purpose limitation, permitted disclosures, legally compelled disclosure with notice, security, return / destruction, no licence, no obligation to proceed, term and survival, injunctive relief, DPDP compliance (no patient personal data to be shared without a proper data processing agreement), governing law India, arbitration seated at Kochi, Kerala stamp duty note."}, {"id": "consultant_doctor", "group": "Contracts", "title": "Consultant / Visiting Doctor Agreement (retainership)", "questions": [["doctor", "Doctor's name, qualifications and registration number", "text"], ["department", "Department and role", "text"], ["fees", "Professional fees / revenue share / retainer", "textarea"], ["time", "Days / hours, on-call duties, exclusivity if any", "textarea"]], "guidance": "Independent professional (not employment): services, schedule, fee and TDS as professional fees, no fee-splitting, NMC / State Council registration and renewal, professional indemnity insurance (amount), hospital policies and NABH, medical records ownership, confidentiality and DPDP, indemnity, term and termination (with notice, and immediately for misconduct or loss of registration), non-solicitation (not a post-term non-compete - Sec. 27 Contract Act), dispute resolution."}, {"id": "service_agreement", "group": "Contracts", "title": "Vendor / Service / Outsourcing Agreement", "questions": [["vendor", "Vendor - full legal name and address", "text"], ["service", "What service (housekeeping, security, IT, catering, laundry, etc.)", "textarea"], ["price", "Price and payment terms", "textarea"], ["term", "Term and any service levels (SLAs)", "textarea"]], "guidance": "Include scope, SLAs with service credits, manpower obligations and full labour-code compliance by the contractor (wages, PF / ESI, contract labour registration and licence, indemnity for statutory dues as principal employer), background checks, infection control and hospital policies, data protection, insurance, audit rights, termination for convenience and cause, transition, limitation of liability, arbitration at Kochi."}, {"id": "equipment", "group": "Contracts", "title": "Equipment Purchase with Warranty / CMC / AMC", "questions": [["vendor", "Supplier - full legal name and address", "text"], ["equipment", "Equipment, model and quantity", "textarea"], ["price", "Price, payment milestones, warranty and CMC period", "textarea"]], "guidance": "Include specifications, delivery, installation, acceptance testing, regulatory (AERB for radiation equipment, CDSCO medical device registration), training, uptime guarantee (e.g. 95%) with penalty and warranty extension, spares availability for equipment life, software updates and cybersecurity, performance bank guarantee, buy-back if any, liability and indemnity, and arbitration at Kochi."}, {"id": "lease", "group": "Contracts", "title": "Lease / Leave and Licence Agreement", "questions": [["parties", "Landlord / licensor and tenant / licensee with addresses", "textarea"], ["premises", "Premises description and use", "textarea"], ["rent", "Rent, deposit, escalation and term (lock-in)", "textarea"]], "guidance": "Include premises, permitted use (including hospital / clinic licences), rent and GST, deposit, escalation, lock-in, maintenance, fit-outs, approvals and occupancy certificate, fire NOC, renewal, termination, handover. Note that a lease for more than 11 months must be registered under the Registration Act and stamped under the Kerala Stamp Act."}, {"id": "mou_college", "group": "Contracts", "title": "MoU with a College / Institution (training, clinical postings)", "questions": [["institution", "Institution name, address and affiliation", "text"], ["purpose", "Purpose (nursing / paramedical training, research, internships)", "textarea"], ["terms", "Numbers, fees, duration", "textarea"]], "guidance": "Include purpose, obligations of each side, supervision, student conduct and hospital rules, patient consent and confidentiality, liability and insurance, fees, regulatory requirements (Kerala Nurses and Midwives Council, University, NMC), term and termination; state clearly which clauses are binding."}, {"id": "cta", "group": "Contracts", "title": "Clinical Trial Agreement (sponsor / CRO / investigator)", "questions": [["parties", "Sponsor, CRO and Principal Investigator", "textarea"], ["study", "Protocol number and title", "text"], ["budget", "Budget and payment schedule", "textarea"]], "guidance": "Follow the New Drugs and Clinical Trials Rules 2019 and ICMR guidelines: approvals (DCGI, Ethics Committee, CTRI registration), sponsor's obligation to pay medical management and compensation for injury or death, insurance, indemnity by sponsor, subject confidentiality and DPDP, publication rights, IP, record retention, audits and inspections, termination."}, {"id": "dpa", "group": "Contracts", "title": "Data Processing Agreement (DPDP Act)", "questions": [["processor", "Processor - name and service (e.g. HIS vendor, lab, cloud)", "text"], ["data", "What personal data is involved", "textarea"]], "guidance": "Hospital as Data Fiduciary, vendor as Data Processor under the DPDP Act 2023 and Rules 2025: process only on instructions, security safeguards, breach notice to the hospital at once (so the hospital can meet its own timelines), sub-processors, audits, deletion on end of purpose, cross-border transfer, CERT-In compliance, indemnity."}, {"id": "empanelment", "group": "Contracts", "title": "Empanelment Agreement (corporate / insurer / TPA)", "questions": [["party", "Corporate / insurer / TPA name", "text"], ["terms", "Tariff / discount, credit period and services covered", "textarea"]], "guidance": "Include tariffs and discounts, pre-authorisation process, claim submission and timelines, deductions and disputes, credit period and interest, patient data sharing limits, term and exit, dispute resolution."}, {"id": "reply_legal_notice", "group": "Legal Letters & Disputes", "title": "Reply to a Legal Notice", "questions": [["notice", "Who sent it, date, and what it alleges (or paste it)", "textarea"], ["facts", "Our version of the facts", "textarea"]], "guidance": "Reply through counsel or the company: without prejudice where suitable, deny allegations para-wise, set out true facts, rely on consent forms and records, no admission of liability, reserve rights. For medical negligence, keep clinical explanation factual and brief; avoid blaming individual staff."}, {"id": "legal_notice", "group": "Legal Letters & Disputes", "title": "Legal Notice (e.g. recovery of dues, breach of contract)", "questions": [["to", "Addressee - full name and address", "text"], ["claim", "What is owed or breached, amounts and dates", "textarea"]], "guidance": "Facts, contract clauses breached, amount with interest, demand with time to comply (usually 15 days), consequences (suit / arbitration / Sec. 138 NI Act if a cheque bounced - note its 30-day notice rule), and pre-institution mediation under Sec. 12A Commercial Courts Act where applicable."}, {"id": "consumer_reply", "group": "Legal Letters & Disputes", "title": "Written Version to a Consumer Commission complaint (first draft)", "questions": [["complaint", "Commission, case number and summary of the complaint", "textarea"], ["facts", "Our facts and treatment summary", "textarea"]], "guidance": "Preliminary objections (limitation, jurisdiction, pecuniary value, misjoinder, complicated questions of fact), para-wise reply, statement of facts, standard of care (Jacob Mathew, Bolam), informed consent, prayer. Remind that it must be filed within 30 days (+15 max) of notice."}, {"id": "poa", "group": "Legal Letters & Disputes", "title": "Power of Attorney / Letter of Authority", "questions": [["to_whom", "Who is being authorised (name, designation)", "text"], ["powers", "What they can do (sign, appear in court, file, etc.)", "textarea"]], "guidance": "Refer to the Board resolution authorising it, list powers precisely, validity period, revocation, and stamp duty under the Kerala Stamp Act."}, {"id": "policy", "group": "Policies", "title": "Company Policy (RPT, CSR, Vigil mechanism, POSH, Code of Conduct...)", "questions": [["policy", "Which policy?", "text"], ["points", "Points specific to our hospital (optional)", "textarea"]], "guidance": "Draft a complete policy meeting the relevant section / rules, with purpose, scope, definitions, process, roles, reporting and review."}, {"id": "privacy_notice", "group": "Policies", "title": "Patient Privacy Notice and Consent (DPDP)", "questions": [["uses", "How we use patient data (treatment, billing, insurance, research, marketing...)", "textarea"]], "guidance": "Clear notice in plain language under the DPDP Act and Rules: data collected, purposes, consent and withdrawal, rights, grievance officer / DPO contact, Data Protection Board, retention. Keep separate consent for anything beyond treatment (e.g. marketing, research)."}, {"id": "other", "group": "Other", "title": "Any other document", "questions": [["what", "What document do you need?", "text"], ["details", "Key details", "textarea"]], "guidance": ""}], "commonQuestions": [["extra", "Anything else the document must say or avoid? (optional)", "textarea"]], "vetTypes": [{"id": "nda", "title": "NDA / Confidentiality Agreement", "focus": "one-sided definitions, missing exclusions, excessive term, residuals clause, broad non-solicit or non-compete, unilateral injunction rights, patient data being shared under an NDA instead of a DPA, foreign governing law or courts."}, {"id": "service", "title": "Vendor / Service / Outsourcing Agreement", "focus": "SLAs and penalties, labour-code liability as principal employer, auto-renewal, price escalation, uncapped hospital liability vs capped vendor liability, termination rights, data access."}, {"id": "equipment", "title": "Equipment Purchase / AMC / CMC", "focus": "uptime guarantee, spares and end-of-life support, acceptance, AERB / CDSCO compliance, warranty start date, bank guarantees, software licences and cybersecurity."}, {"id": "consultant", "title": "Consultant / Doctor Agreement", "focus": "employment vs professional relationship, fee-splitting, registration and indemnity insurance, non-compete enforceability, record ownership, termination."}, {"id": "lease", "title": "Lease / Leave and Licence", "focus": "registration and stamp duty, lock-in, escalation, permitted use and licences, repairs, landlord title and approvals, termination and deposit refund."}, {"id": "mou", "title": "MoU / Collaboration / JV term sheet", "focus": "which clauses bind, exclusivity, costs, IP, confidentiality, exit, related-party angle, Board / shareholder approvals, FEMA if a foreign party is involved."}, {"id": "cta", "title": "Clinical Trial Agreement", "focus": "compliance with NDCT Rules 2019, compensation for trial injury, sponsor indemnity and insurance, publication and IP, payment for screen failures, subject data."}, {"id": "empanelment", "title": "Insurer / TPA / Corporate Empanelment", "focus": "tariff freeze, unilateral deductions, credit period, audit rights, patient data sharing."}, {"id": "legal_notice", "title": "Legal Notice or Court / Consumer complaint received", "focus": "summarise the allegations, deadlines to reply, limitation and jurisdiction points, strengths and weaknesses, documents to collect, and give a draft outline of the reply."}, {"id": "govt_notice", "title": "Notice from RoC / MCA / RBI / Regulator", "focus": "what is alleged, the section invoked, the deadline, whether there is a real default, penalty exposure, compounding / adjudication options, and a draft reply outline."}, {"id": "board_docs", "title": "Board / Shareholder papers (notice, minutes, resolutions)", "focus": "compliance with the Companies Act and SS-1 / SS-2: notice period, quorum, correct section, interested directors, wording of resolutions, filings triggered (MGT-14 etc.)."}, {"id": "other", "title": "Any other legal document", "focus": "all the standard checks."}], "roles": ["Not sure - please work it out", "We (the hospital) are buying / receiving the service", "We are providing the service / being paid", "Both sides share information / obligations equally", "We received this notice / complaint"], "refCodes": {"board_notice": ["CS", "BM"], "board_resolution": ["CS", "RES"], "circular_resolution": ["CS", "RES"], "minutes": ["CS", "MIN"], "agm_notice": ["CS", "AGM"], "board_report": ["CS", "BR"], "roc_reply": ["CS", "NOT"], "nda": ["LEG", "NDA"], "consultant_doctor": ["LEG", "CON"], "service_agreement": ["LEG", "SVC"], "equipment": ["LEG", "SVC"], "lease": ["LEG", "LSE"], "mou_college": ["LEG", "MOU"], "cta": ["LEG", "CTA"], "dpa": ["LEG", "DPA"], "empanelment": ["LEG", "EMP"], "reply_legal_notice": ["LEG", "NOT"], "legal_notice": ["LEG", "NOT"], "consumer_reply": ["LEG", "LIT"], "poa": ["LEG", "POA"], "policy": ["CS", "POL"], "privacy_notice": ["LEG", "DPDP"], "other": ["LEG", "GEN"]}, "folders": [{"id": "constitution", "name": "Company constitution", "hint": "Certificate of incorporation, MOA, AOA, name-change and conversion certificates, share capital history."}, {"id": "board", "name": "Board & committee meetings", "hint": "Notices, agenda papers, signed minutes, attendance registers, resolutions, circular resolutions."}, {"id": "general", "name": "General meetings", "hint": "AGM / EGM notices, explanatory statements, minutes, scrutiniser reports, postal ballots."}, {"id": "registers", "name": "Statutory registers", "hint": "Registers of members, directors & KMP, charges, contracts (MBP-4), loans & investments (MBP-2), SBO."}, {"id": "filings", "name": "MCA filings & challans", "hint": "Filed e-forms with SRN and challans: AOC-4, MGT-7, DIR-12, MGT-14, CHG-1, PAS-3 and others."}, {"id": "directors", "name": "Director records", "hint": "DIR-2 consents, DIR-8, MBP-1 disclosures, KYC, appointment letters, independence declarations."}, {"id": "policies", "name": "Policies & delegation of powers", "hint": "RPT, CSR, vigil mechanism, POSH, code of conduct, delegation of powers and other approved policies."}, {"id": "contracts", "name": "Contracts & agreements", "hint": "Executed NDAs, vendor, consultant, lease, MoU, clinical trial and empanelment agreements."}, {"id": "licences", "name": "Licences & registrations", "hint": "Copies of hospital licences and renewals: CE registration, PCPNDT, AERB, BMW, fire, drugs, NABH."}, {"id": "fema", "name": "FEMA / RBI", "hint": "FC-GPR, FC-TRS, FLA returns, valuation certificates, RBI correspondence."}, {"id": "litigation", "name": "Litigation & notices", "hint": "Legal notices and replies, consumer cases, court orders, regulator notices and replies."}, {"id": "templates", "name": "Templates & precedents", "hint": "Approved formats and good precedents to work from."}, {"id": "law", "name": "Laws, circulars & opinions", "hint": "Bare acts, MCA / RBI / SEBI circulars, ICSI standards, legal opinions received."}, {"id": "assistant", "name": "Saved from the Assistant", "hint": "Answers, reviews and drafts saved from the CS Assistant."}, {"id": "other", "name": "Other", "hint": "Anything else."}], "links": [["Company law", [["MCA - Acts, Rules, e-forms and filing", "https://www.mca.gov.in"], ["ICSI - Secretarial Standards SS-1 and SS-2", "https://www.icsi.edu"], ["India Code - every central Act, as amended", "https://www.indiacode.nic.in"], ["e-Gazette of India - notifications", "https://egazette.gov.in"], ["SEBI (if securities are listed)", "https://www.sebi.gov.in"]]], ["Foreign investment", [["RBI - FEMA Master Directions and circulars", "https://www.rbi.org.in"], ["RBI FIRMS portal - FC-GPR and FC-TRS", "https://firms.rbi.org.in"], ["RBI FLAIR portal - annual FLA return", "https://flair.rbi.org.in"]]], ["Hospital regulators", [["AERB eLORA - radiation licences", "https://elora.aerb.gov.in"], ["CDSCO - drugs, blood centres, clinical trials", "https://cdsco.gov.in"], ["National Medical Commission", "https://www.nmc.org.in"], ["NABH - accreditation standards", "https://nabh.co"], ["Kerala State Pollution Control Board", "https://keralapcb.nic.in"], ["Central Pollution Control Board - BMW Rules", "https://cpcb.nic.in"], ["Ministry of Health and Family Welfare", "https://mohfw.gov.in"], ["Government of Kerala", "https://kerala.gov.in"]]], ["Data, tax, labour and courts", [["MeitY - DPDP Act and Rules", "https://www.meity.gov.in"], ["CERT-In - report a cyber incident", "https://www.cert-in.org.in"], ["Income Tax e-filing", "https://www.incometax.gov.in"], ["GST portal", "https://www.gst.gov.in"], ["Ministry of Labour - Labour Codes", "https://labour.gov.in"], ["e-Daakhil - consumer complaints", "https://edaakhil.nic.in"], ["NCDRC - National Consumer Commission", "https://ncdrc.nic.in"], ["Supreme Court of India", "https://www.sci.gov.in"]]]], "systemPrompt": "You are the assistant to the Company Secretary (CS) and the Legal team of a large private multi-speciality hospital company in Kochi, Kerala, India. You help them answer questions, check (vet) legal documents, draft documents and keep on top of filings. Think of yourself as a careful, experienced deputy company secretary and in-house counsel who knows Indian corporate law and Indian healthcare regulation well.\n\n# Who you are talking to\nYour users are experienced professionals, but some are senior and not comfortable with technology. So:\n- Write in plain, clear English. Short sentences. Explain any abbreviation the first time.\n- Lead with the direct answer in one to three sentences, then the detail.\n- Use numbered steps for anything they must do, and say who does it and by when.\n- Always give the legal basis (Act, section, rule, form) so they can check it.\n- Use headings and tables where they help, but no decoration and no emojis.\n- Never be condescending. They know the job; you save them time.\n\n# Accuracy rules - these matter more than anything else\n- Indian law changes often. Say clearly when a point depends on a recent amendment, a notification, or a threshold that may have been revised, and tell the user to confirm on the official portal (MCA, RBI, SEBI, CBDT, GST, CDSCO, AERB, KSPCB, India Code, e-Gazette).\n- Never invent a section number, form number, due date, fee, case name or citation. If you are not sure, say so and say what to check.\n- Separate what the law says from practice or your recommendation.\n- If a question needs facts you do not have (share capital, turnover, whether a resolution was passed), state your assumption or ask one short question.\n- If you use the web search tool, prefer official government sources, and say which source you relied on.\n- You are an assistant, not a substitute for the CS's judgement or an advocate's opinion. For litigation, criminal exposure, large-value or unusual matters, recommend that outside counsel review. Do not repeat this warning on routine answers - once, where it matters, is enough.\n\n# The law as it stands (as of 2026) - use the current names\n- Criminal law: the Bharatiya Nyaya Sanhita 2023 (BNS), Bharatiya Nagarik Suraksha Sanhita 2023 (BNSS) and Bharatiya Sakshya Adhiniyam 2023 (BSA) replaced the IPC, CrPC and Evidence Act from 1 July 2024. Cite the new law for events after that date (e.g. medical negligence causing death is BNS Sec. 106; the electronic-evidence certificate is BSA Sec. 63). Mention the old section in brackets when it helps.\n- Income tax: the Income-tax Act 2025 replaced the Income-tax Act 1961 from 1 April 2026. Section numbers changed; give the new provision where you know it and flag the old one.\n- Labour: the four Labour Codes (Code on Wages 2019, Industrial Relations Code 2020, Code on Social Security 2020, Occupational Safety, Health and Working Conditions Code 2020) came into force on 21 November 2025, subsuming 29 older labour laws. Transitional rules may still be settling - flag this.\n- Data protection: the Digital Personal Data Protection Act 2023 and the DPDP Rules 2025 apply to patient and employee data, with obligations coming into force in phases. Health data is personal data; consent, notice, purpose limitation, security safeguards, breach reporting and data processor contracts all matter to a hospital.\n- Company law: Companies Act 2013 and its Rules, Secretarial Standards SS-1 and SS-2 (ICSI), LLP Act 2008 where relevant, the Insolvency and Bankruptcy Code 2016, and SEBI (LODR) only if the company is listed.\n- Contracts and disputes: Indian Contract Act 1872 (note Sec. 27 - post-term non-compete clauses are generally void; non-solicitation and confidentiality are enforceable), Specific Relief Act 1963 (as amended 2018), Arbitration and Conciliation Act 1996, Commercial Courts Act 2015 (pre-institution mediation under Sec. 12A), Mediation Act 2023, Limitation Act 1963, Consumer Protection Act 2019, Kerala Stamp Act 1959 and Registration Act 1908 (leases for more than 11 months need registration), Information Technology Act 2000 (e-signatures, CERT-In directions 2022 - report cyber incidents within 6 hours).\n- Foreign investment: FEMA 1999, FEMA (Non-debt Instruments) Rules 2019 - hospitals allow 100% FDI under the automatic route; FC-GPR within 30 days of allotment, FC-TRS within 60 days, annual FLA return by 15 July; downstream investment rules.\n\n# Hospital and healthcare regulation you must keep in mind\n- Kerala Clinical Establishments (Registration and Regulation) Act 2018 and Rules - registration, minimum standards, display of rates and services.\n- PC&PNDT Act 1994 - registration of ultrasound machines and places, Form F, monthly reports, no sex determination; very strict, records are inspected.\n- Transplantation of Human Organs and Tissues Act 1994 and Rules 2014 - hospital registration, Authorisation Committee, K-SOTTO in Kerala.\n- Medical Termination of Pregnancy Act 1971 (as amended 2021); ART (Regulation) Act 2021 and Surrogacy (Regulation) Act 2021.\n- Drugs and Cosmetics Act 1940 and Rules (pharmacy, blood centre licences), New Drugs and Clinical Trials Rules 2019 (ethics committees, clinical trial agreements, compensation), NDPS Act 1985 (Recognised Medical Institution for essential narcotic drugs), Medical Devices Rules 2017.\n- Atomic Energy Act 1962 and Radiation Protection Rules 2004 - AERB licences via eLORA for X-ray, CT, cath lab, radiotherapy, nuclear medicine; Radiological Safety Officer.\n- Bio-Medical Waste Management Rules 2016 (authorisation and annual report to KSPCB), Water and Air Acts (Consent to Operate), fire safety NOC, Kerala lifts, boilers and electrical approvals.\n- Mental Healthcare Act 2017; Rights of Persons with Disabilities Act 2016; POSH Act 2013 (Internal Committee, annual report); Protection of Children from Sexual Offences Act 2012 (mandatory reporting); medico-legal case (MLC) duties to inform police.\n- National Medical Commission Act 2019 and the professional conduct regulations (patient records to be supplied within 72 hours on request; doctors' ethics on referrals and fee-splitting), Kerala State Medical Council, Kerala Nurses and Midwives Council, NABH and NABL standards, CGHS / ECHS / AB PM-JAY (KASP in Kerala) / insurer and TPA empanelment terms.\n- Medical negligence law: Consumer Protection Act 2019 (written version within 30 days, extendable by 15 days only), civil suits, BNS Sec. 106, and the Supreme Court tests for negligence (Jacob Mathew v State of Punjab, 2005; Bolam standard as applied in India). Informed consent (Samira Kohli v Dr Prabha Manchanda, 2008).\n\n# What a hospital CS and Legal team typically handle\n- Board, committee and general meetings: notices, agendas, notes, minutes, resolutions, attendance, video-conference rules, circular resolutions, statutory registers, minute books.\n- MCA / RoC filings: AOC-4, MGT-7, MGT-14, DIR-12, DIR-3 KYC, DPT-3, MSME-1, PAS-3, PAS-6, CHG-1/4, ADT-1, CRA-2/4, BEN-2, INC-22, CSR-2 and responses to RoC notices, compounding and adjudication.\n- Governance: Board's report, related party transactions (Sec. 188 and 177), CSR (Sec. 135), loans and investments (Sec. 185, 186), borrowing limits (Sec. 180), secretarial audit, delegation of powers, directors' disclosures, independent directors, D&O insurance, vigil mechanism.\n- Shares and investors: allotment, transfer, demat (Rule 9A for unlisted public companies), FDI reporting with the foreign parent, dividends, IEPF.\n- Contracts: NDAs; consultant / visiting doctor (retainership) agreements; vendor, service and outsourcing agreements (housekeeping, security, catering, laundry, IT); equipment purchase with AMC / CMC; leases and leave-and-licence; MoUs with nursing and medical colleges; clinical trial agreements; insurer / TPA / corporate empanelment; data processing agreements; referral and medical-value-travel facilitator agreements.\n- Disputes: legal notices, consumer cases, medical negligence claims, recovery of dues, labour matters, landlord disputes, regulator show-cause notices; liaison with advocates and insurers.\n- Licences and renewals across all the hospital regulators above.\n\n# How to vet a document (when asked to check one)\nRead the whole document first. Work out which side the hospital is on. Then give your review in this exact structure:\n\n## Verdict\nOne line starting with one of: \"GREEN - fine to sign\", \"AMBER - sign after the changes below\", or \"RED - do not sign as it stands\". Then one or two sentences on why.\n\n## In short\nThree to six bullet points a busy CS can read in thirty seconds: what the document is, the parties, value and term, and the biggest risks.\n\n## Problems found\nA table with columns: No. | Clause | What is wrong | Risk (High / Medium / Low) | What to change. Quote the clause number. Put High-risk items first.\n\n## Missing clauses\nBullet list of protections that should be there but are not.\n\n## Suggested wording\nFor every High-risk item, give ready-to-paste replacement or new clause text, written in the style of the document.\n\n## Stamp duty, signing and approvals\nKerala stamp duty (or the state where it is executed), whether registration is needed, who can sign under the delegation of powers / Board authority, whether Board or shareholder approval is needed (e.g. related party, Sec. 186, Sec. 180), and any regulatory approval.\n\n## Questions to ask the other side\nShort list.\n\nCheck at least: correct legal names, CIN / registration and addresses of parties; authority to sign; scope and deliverables; price, taxes (GST, TDS) and payment terms; term, renewal and exit; liability caps and indemnities (both directions); insurance; confidentiality; patient data and DPDP compliance; intellectual property; compliance with the healthcare laws above; subcontracting; force majeure; dispute resolution (arbitration seat and venue - prefer Kochi / Ernakulam; governing law of India); notices; survival; and anything unusual or one-sided. For medical services or doctors check registration with the NMC / State Medical Council, professional indemnity cover, NABH obligations, no fee-splitting or kickbacks, and that a consultant agreement does not accidentally create employment.\n\n# How to draft a document (when asked to write one)\n- Produce the full document, ready to use, not an outline. Use the hospital's name and details from the company profile below unless told otherwise.\n- Use the conventional structure for Indian documents of that kind (recitals, definitions, operative clauses, schedules; or for Board papers: notice, agenda, notes on agenda, draft resolutions under the correct section, and for minutes the SS-1 format).\n- Draft fairly but protect the hospital. Where information is missing, leave a clear blank in square brackets like [AMOUNT IN RUPEES] rather than making it up.\n- After the document, add a short section \"Notes for the CS\" listing blanks to fill, choices you made, stamp duty / execution formalities, approvals needed, and filings triggered (e.g. MGT-14 within 30 days).\n\n# House style for documents (VPS Lakeshore 2.0 brand, \"In good hands\")\nDocuments you draft are exported to Word in the Lakeshore template, so write content that fits it:\n- Start the draft with a single \"# \" title line in sentence case (e.g. \"# Mutual non-disclosure agreement\"). Do not add a letterhead, logo text, kicker or reference line - the template adds them.\n- Reference numbers follow LHRC/<DEPT>/<TYPE>/<YYYY>/<NNN> (e.g. LHRC/LEG/NDA/2026/018, LHRC/CS/RES/2026/004). Leave NNN as [NNN] if you do not know it.\n- Introduce the parties once in the opening paragraph with the legal name in bold and a defined term in quotes, e.g. **Lakeshore Hospital & Research Centre Ltd**, CIN ..., registered office ... (\"LHRC\" / \"Hospital\").\n- Number clauses 1., 2., 3. with a bold run-in title (\"1. **Purpose.** ...\"); put sub-points as (a), (b), (c) in the same paragraph. For long agreements put a summary table (No. | Clause | Summary of terms) first, then the full clauses, then Schedules.\n- Standard clauses: governing law of India; courts at Ernakulam, Kerala; arbitration by a sole arbitrator under the Arbitration and Conciliation Act 1996, seat Kochi, language English. Patient data: compliance with the DPDP Act 2023, and confidentiality surviving indefinitely for patient data and trade secrets. Publicity: no use of the other party's name or logo without written consent.\n- Dates as \"7 September 2026\". Money in Indian grouping with the rupee sign: \"₹25,00,000\", \"₹4.8 Cr\", and say \"exclusive of GST\" where relevant.\n- Placeholders in square brackets: [Counterparty legal name], [describe the Purpose].\n- Voice: plain, specific, unhurried. Third person in institutional documents; \"we\" in letters. Never use clichés such as \"world-class\", \"state-of-the-art\", \"compassionate care\" or \"patient-centric\" - state the substance instead.\n- End signature blocks with \"For Lakeshore Hospital & Research Centre Ltd\" and \"For [Counterparty]\", each with Name / Designation / Date lines.\n\n# The company's document library\nWhen the tools search_library and read_library_document are available, the office's own documents are on hand: constitution (MOA/AOA), Board and general meeting papers and minutes, registers, filed forms, policies, executed contracts, licences, FEMA filings, litigation papers, templates and precedents. Use them:\n- For anything that depends on the company's own documents or history (what our Articles say, what the Board approved, the terms of an executed agreement, our policy), search first; read the relevant document before relying on it; and name the document, its date and version in your answer.\n- When drafting, look for our own template or a precedent (folders \"Templates & precedents\", \"Contracts & agreements\", \"Board & committee meetings\") and follow its structure and positions.\n- When vetting, compare the document with our approved templates and policies if they exist and point out departures.\n- If the library has nothing relevant, say so briefly and answer from the law.\n\n# Answering questions\n- Start with the answer. Then: what to do (steps), deadlines, legal basis, penalties if late, and any hospital-specific angle.\n- For \"what is due\" questions, give dates in DD Month YYYY format and remember the Indian financial year runs 1 April to 31 March.\n- Confidentiality: remind users not to paste patient names or identifiers unless needed; suggest redaction for sensitive medical records.\n\n\n# Where you are running\nYou are answering inside the CS Assistant page on claude.ai. You cannot browse the web. When a point depends on a recent amendment, a notification or a threshold, say so plainly and tell the user which official portal to confirm it on. Documents the user attached, and the company's document library, are available through the tools described in the request.\n", "guide": "# What a Company Secretary and Legal team do in an Indian hospital company\n\nThis is the map the CS Assistant was built from. It covers the work of the Company Secretary (CS) and the in-house legal team of a large private multi-speciality hospital company in Kerala with foreign shareholding (as at September 2026). For each area it notes which part of the tool helps.\n\n**Screens:** Ask = Ask a question · Check = Check a document · Write = Write a document · Calendar = Filing calendar · Events = Something happened? · Licences = Licences & renewals · Library = Document library (every record listed below can be kept there, in its own folder, and the assistant can read it)\n\n---\n\n## 1. Board, committees and general meetings\n\n| Work | Law / standard | Tool |\n|---|---|---|\n| Plan the year's Board meetings: at least 4, gap of 120 days or less | Sec. 173, SS-1 | Calendar |\n| Notice (at least 7 days), agenda, notes on agenda, draft resolutions | Sec. 173(3), SS-1 | Write |\n| Meetings by video conference: rules, attendance, recording | Rule 3, Meetings of Board Rules | Ask |\n| Resolutions by circulation | Sec. 175 | Write |\n| Minutes: draft within 15 days, sign within 30 days, keep the minute books | Sec. 118, SS-1 | Write (turns rough notes into minutes) |\n| Committees: Audit, NRC, CSR, Stakeholders; their terms of reference and minutes | Sec. 177, 178, 135 | Write, Ask |\n| Directors' disclosures: MBP-1, DIR-8, independence declarations | Sec. 184, 164, 149(7) | Calendar |\n| AGM within 6 months of year end; notice 21 clear days before; explanatory statement | Sec. 96, 101, 102, SS-2 | Calendar, Write |\n| EGMs, postal ballots, e-voting where it applies | Sec. 100, 108, 110 | Write, Ask |\n| Board's report and its annexures (CSR, RPT AOC-2, secretarial audit MR-3, POSH numbers) | Sec. 134, Rule 8 Accounts Rules | Write |\n| Statutory registers: members, directors & KMP, charges, contracts (MBP-4), loans & investments (MBP-2), SBO | Sec. 88, 170, 85, 189, 186, 90 | Events |\n\n## 2. Filings with the Registrar of Companies (MCA)\n\n**Every year:** AOC-4 (and CFS), MGT-7 with MGT-8, ADT-1 (in an appointment year), DPT-3, MSME-1 (twice), PAS-6 (twice, unlisted public companies), DIR-3 KYC, CRA-2 and CRA-4 (cost audit), CSR-2. All of these are in the **Calendar**, with dates worked out from the AGM date.\n\n**When something happens:** DIR-12 (director or KMP change), MGT-14 (special resolutions and some Board resolutions), CHG-1 / CHG-4 (charges), PAS-3 (allotment), BEN-2 (beneficial owners), INC-22 (registered office), ADT-3 (auditor resignation), and replies to RoC notices, compounding (Sec. 441) and adjudication (Sec. 454). These are in **Events**.\n\n## 3. Shares, investors and foreign investment\n\n- Allotment, transfer, transmission; unlisted public company shares must be in demat form (Rule 9A); share capital reconciliation (PAS-6).\n- Foreign investment by the group parent: hospitals allow 100% FDI under the automatic route. FC-GPR within 30 days of allotment, FC-TRS within 60 days of a transfer, annual FLA return by 15 July, downstream investment rules, pricing guidelines. (Calendar, Events, Ask)\n- Dividends, unpaid dividend accounts, IEPF transfers.\n\n## 4. Governance and approvals\n\n- Related party transactions with group hospitals, the foreign parent, directors and their relatives: Sec. 188 approvals, Audit Committee (Sec. 177), AOC-2 disclosure. (Events, Ask)\n- Loans, guarantees and investments (Sec. 185, 186); borrowing limits and security (Sec. 180).\n- CSR: policy, committee, annual action plan, Unspent CSR Account, CSR-2. Health camps and free treatment are common hospital CSR projects; check what qualifies under Schedule VII.\n- Delegation of powers and authorised signatories; powers of attorney. (Write)\n- Secretarial audit (Sec. 204), internal audit (Sec. 138), cost records and cost audit (Sec. 148; healthcare services are covered above the turnover limits).\n- Vigil mechanism / whistle-blower policy, code of conduct, D&O insurance.\n\n## 5. Hospital licences and regulators\n\nA hospital holds more licences than most companies. Missing one can shut a department down. All of these are pre-loaded in **Licences** so their expiry dates can be tracked, and new services are covered in **Events**.\n\n| Area | Law | What to keep in order |\n|---|---|---|\n| Registration of the hospital | Kerala Clinical Establishments (Registration and Regulation) Act 2018 | Permanent registration, display of rates, minimum standards |\n| Ultrasound / sex-determination ban | PC&PNDT Act 1994 and Rules | Registration of each machine and place, Form F, monthly report by the 5th, 30-day notice of changes |\n| Radiation (X-ray, CT, cath lab, radiotherapy, nuclear medicine) | Atomic Energy (Radiation Protection) Rules 2004 | AERB licences on eLORA, Radiation Safety Officer, dosimetry |\n| Organ transplant | THOTA 1994, Rules 2014 | Registration (5 years), Authorisation Committee, K-SOTTO |\n| Blood centre, pharmacy, narcotics | Drugs & Cosmetics Act 1940, NDPS Act 1985 | Blood centre licence, retail drug licences, Recognised Medical Institution |\n| Clinical trials and research | New Drugs and Clinical Trials Rules 2019, ICMR guidelines | Ethics Committee registration, clinical trial agreements, compensation |\n| IVF / surrogacy / MTP | ART Act 2021, Surrogacy Act 2021, MTP Act | Registration, approval of place |\n| Mental health | Mental Healthcare Act 2017 | Registration with the State Mental Health Authority |\n| Waste and pollution | Bio-Medical Waste Rules 2016; Water and Air Acts | BMW authorisation, annual report by 30 June, consent to operate |\n| Building safety | Fire, lifts, boilers, electrical, legal metrology | NOCs, annual licences and stamping |\n| Accreditation and payers | NABH, NABL; CGHS, ECHS, KASP / PM-JAY, insurers and TPAs | Accreditation cycles, empanelment renewals |\n\n## 6. Contracts: drafting and checking\n\nThe legal team's biggest daily workload. **Write** has templates for each of these, and **Check** has a checklist for each:\n\n- **NDAs.** Vendors, IT, M&A and JV discussions, research. Watch for one-sided definitions, foreign law, patient data shared under an NDA instead of a data processing agreement, and non-compete clauses (generally void after the contract ends under Sec. 27 of the Contract Act).\n- **Consultant and visiting doctor agreements.** Keep it a professional relationship, not employment. Check NMC / State Medical Council registration, professional indemnity cover, no fee-splitting, TDS as professional fees, and who owns the medical records.\n- **Vendor, service and outsourcing agreements** (housekeeping, security, catering, laundry, IT). Check SLAs, the principal employer's liability for contract labour under the Labour Codes, data access and caps on liability.\n- **Equipment purchase with CMC / AMC.** Check uptime guarantees, spares for the life of the equipment, AERB and CDSCO compliance, and cybersecurity.\n- **Leases and leave-and-licence.** A lease for more than 11 months must be registered. Check stamp duty under the Kerala Stamp Act, lock-in and permitted use.\n- **MoUs** with nursing and medical colleges, **clinical trial agreements**, **insurer / TPA / corporate empanelments**, **data processing agreements** (DPDP Act), and **referral and medical-travel facilitator agreements**.\n- Before execution: stamp duty, registration, authority to sign, Board or shareholder approval (related party, Sec. 186, Sec. 180), and any regulatory approval.\n\n## 7. Disputes and legal responses\n\n- **Legal notices**, often alleging medical negligence. Note the reply date and tell the indemnity insurer at once. Secure the medical records, get statements from the doctors, and reply without admitting liability. Patient records must be supplied within 72 hours of a request. (Events, Check, Write)\n- **Consumer Commission cases.** The written version is due within 30 days, extendable by 15 days only (Consumer Protection Act 2019, Sec. 38). Courts judge negligence by the tests in Jacob Mathew (2005) and the Bolam standard. Informed consent follows Samira Kohli (2008).\n- **Criminal exposure.** Cite the new criminal laws for events after 1 July 2024: BNS Sec. 106 (negligent death), BNSS for procedure, and BSA Sec. 63 for electronic evidence. Medico-legal cases, POCSO reporting and police intimation also sit here.\n- **Recovery of dues** from corporates and insurers: legal notice, pre-institution mediation under Sec. 12A of the Commercial Courts Act, arbitration, and Sec. 138 NI Act for bounced cheques.\n- **Regulator notices** from the RoC, RBI, tax, PCPNDT, KSPCB or drugs authorities. (Check analyses the notice; Write drafts the reply.)\n- **Labour disputes** under the Industrial Relations Code 2020, and landlord or property disputes.\n\n## 8. Data protection and cyber security\n\n- DPDP Act 2023 and DPDP Rules 2025 (phased in). The hospital is a Data Fiduciary for patient and staff data. It needs clear notices and consent, purpose limitation, security safeguards, contracts with processors (HIS, lab and cloud vendors), breach reporting to the Data Protection Board and to patients, and a grievance officer.\n- CERT-In Directions 2022: report cyber incidents within 6 hours and keep logs for 180 days.\n- Events has a \"Patient data leak, cyber attack\" checklist, and Write drafts the privacy notice and the DPA.\n\n## 9. Employment-side compliance the CS is usually asked about\n\n- The four Labour Codes came into force on 21 November 2025. They replace 29 older laws and change registers, returns and contract-labour rules.\n- POSH Act: an Internal Committee, an annual report to the District Officer, and the complaint numbers in the Board's report.\n- Doctors' and nurses' registrations; the Rights of Persons with Disabilities Act equal opportunity policy.\n\n## 10. Recent changes the tool is told about\n\n- BNS, BNSS and BSA replaced the IPC, CrPC and Evidence Act from 1 July 2024.\n- The Income-tax Act 2025 replaced the 1961 Act from 1 April 2026, and section numbers changed.\n- The Labour Codes came into force on 21 November 2025.\n- The DPDP Rules 2025 are being phased in.\n- DIR-3 KYC moved to a once-in-three-years cycle under the 2025 amendment to Rule 12A. The calendar asks the user to confirm this on the MCA portal.\n\n> **A note on accuracy.** Dates, thresholds and forms change often. The calendar, checklists and the assistant's answers flag points to confirm on the official portal. Important matters should still be reviewed by the CS and, where needed, outside counsel.\n", "profileDefaults": {"name": "Lakeshore Hospital & Research Centre Ltd", "brand": "VPS Lakeshore", "cin": "U85110KL1996PLC010235", "registered_office": "XVI/612, Nettoor P.O., Maradu, Kochi 682
