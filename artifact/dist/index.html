  const out = [table(rows, [PAGE.content - rightW, rightW])];
  if (o.rule === 'navy') out.push(navyRule({ before: 100, after: 220 }));
  else out.push(...spacer(1, 10));
  return out;
}

/**
 * Letterhead: colour logo left (large), organisation address right in slate, navy rule.
 * o.addressLines (array), o.email, o.logoWidth
 */
function letterhead(o = {}) {
  const lines = o.addressLines || ORG.addressLines;
  const right = lines.map((t) => para(runs({ text: t, size: 9.5, color: C.slate }), { align: AlignmentType.RIGHT, line: 250 }));
  if (o.email) right.push(para(runs({ text: o.email, size: 9.5, color: C.slate }), { align: AlignmentType.RIGHT, line: 250 }));
  const rows = [new TableRow({ children: [
    cell(para([logoColour(o.logoWidth || 212)], { line: 240 }), { width: 4400, valign: VerticalAlign.TOP }),
    cell(right, { width: PAGE.content - 4400, valign: VerticalAlign.TOP }),
  ] })];
  return [table(rows, [4400, PAGE.content - 4400]), navyRule({ before: 160, after: 260 })];
}

/** Ref left, date right (letters). */
function refLine(ref, date) {
  return para([
    ...runs({ text: ref, size: 10, color: C.slate }),
    new TextRun({ text: '\t' }),
    ...runs({ text: date, size: 10, color: C.slate }),
  ], { tabStops: [{ type: TabStopType.RIGHT, position: PAGE.content }], after: 200, line: 260 });
}

/** Addressee line with optional pill in front: pill + "Dr. Name, MBBS…". Always returns an array — spread it. */
function addressee(o = {}) {
  if (!o.pill) return [para(runs({ text: o.text, size: 10.5 }), { after: 200, line: 260 })];
  const pw = Math.max(1100, Math.round(String(o.pill).length * 92 + 520));
  const rows = [new TableRow({ children: [
    cell(pill(o.pill, 'filled'), { width: pw + 200, valign: VerticalAlign.CENTER }),
    cell(para(runs({ text: o.text, size: 10.5 }), { line: 240 }), { width: PAGE.content - pw - 200, valign: VerticalAlign.CENTER }),
  ] })];
  return [table(rows, [pw + 200, PAGE.content - pw - 200]), ...spacer(1, 6)];
}

const subject = (text) => para(runs({ text: `Subject: ${text}`, size: 10.5, weight: 'semibold', color: C.navy }), { after: 200, line: 260 });

/**
 * Full-bleed navy band header (agreements, circulars, notices) — returns a Header for the FIRST page.
 * Use it as `firstHeader` on the section (buildDoc then zeroes the header distance so the band
 * touches the top edge, and the body starts below it).
 * o.pill {text} | string, o.title (cream, light 26pt; \n forces a break), o.meta [{label, value}] (≤4),
 * o.titleSize, o.logoWidth
 */
function bandHeader(o = {}) {
  const inner = PAGE.content;
  const pillText = o.pill ? (o.pill.text || o.pill) : null;
  const topRow = table([new TableRow({ children: [
    cell(pillText ? [pill(pillText, 'filled')] : [para([new TextRun({ text: '', size: 2 })], { line: 240 })], { width: inner - 2700, valign: VerticalAlign.TOP }),
    cell(para([logoWhite(o.logoWidth || 170)], { align: AlignmentType.RIGHT, line: 240 }), { width: 2700, valign: VerticalAlign.TOP }),
  ] })], [inner - 2700, 2700]);
  const content = [topRow];
  const titleLines = String(o.title || '').split('\n');
  const titleRuns = [];
  titleLines.forEach((t, i) => titleRuns.push(...runs({ text: t, size: o.titleSize || 26, weight: 'light', color: C.cream, break: i > 0 })));
  content.push(para(titleRuns, { line: 260, before: 260, after: o.meta ? 300 : 120 }));
  if (o.meta && o.meta.length) {
    content.push(para([new TextRun({ text: '', size: 2 })], { border: { bottom: line(C.bandRule, 4) }, after: 160, line: 120 }));
    const widths = splitWidths(o.meta.length, inner);
    content.push(table([new TableRow({ children: o.meta.map((m, i) => cell([
      para(runs({ text: m.label, size: 7.5, weight: 'medium', caps: true, tracking: 30, color: C.bandLabel }), { after: 40, line: 240 }),
      para(runs({ text: m.value, size: 10, color: C.white }), { line: 260 }),
    ], { width: widths[i], margins: pad(0, 0, 0, 200) })) })], widths));
  }
  const bandCell = cell(content, { width: PAGE.width, fill: C.navy, margins: pad(700, 560, PAGE.margin.left, PAGE.margin.right) });
  const band = table([new TableRow({ children: [bandCell] })], [PAGE.width], { indent: -PAGE.margin.left });
  const hdr = new Header({ children: [band, ...spacer(1, 12)] });
  hdr.__lakeshoreBand = true;
  return hdr;
}

// ---------------------------------------------------------------------------
// Data / form components
// ---------------------------------------------------------------------------
/**
 * Numbered clauses (legal). items: [{title, text}] — number magenta, title navy semibold inline.
 * o.start (default 1), o.numWidth
 */
function clauses(items, o = {}) {
  const nw = o.numWidth || 700;
  const rows = items.map((it, i) => new TableRow({ children: [
    cell(para(runs({ text: `${(o.start || 1) + i}.`, size: 10, weight: 'semibold', color: C.magenta }), { line: 300 }), { width: nw, margins: pad(0, 140, 0, 0) }),
    cell(para([
      ...(it.title ? runs({ text: `${it.title} `, size: 10, weight: 'semibold', color: C.navy }) : []),
      ...runs(it.text, { size: 10 }),
    ], { line: 300 }), { width: PAGE.content - nw, margins: pad(0, 140, 0, 0) }),
  ] }));
  return table(rows, [nw, PAGE.content - nw]);
}

/**
 * Form fields with write-in rules. rows: [[{label, value?, span?}, ...], ...]; each row's cells split evenly
 * (or by span weights). A navy rule sits under each field.
 */
function fieldGrid(rows, o = {}) {
  const gap = 260;
  const out = rows.map((cells) => {
    const spans = cells.map((c) => c.span || 1);
    const total = spans.reduce((a, b) => a + b, 0);
    const avail = PAGE.content - gap * (cells.length - 1);
    const widths = [];
    const children = [];
    cells.forEach((c, i) => {
      const w = Math.floor((avail * spans[i]) / total);
      widths.push(w);
      children.push(cell([
        label(c.label, { after: 60 }),
        para(runs({ text: c.value || ' ', size: 10 }), { line: 260, border: { bottom: line(C.navy, 6) }, after: 0 }),
      ], { width: w, margins: pad(0, 200, 0, 0) }));
      if (i < cells.length - 1) { widths.push(gap); children.push(cell(para([new TextRun('')]), { width: gap })); }
    });
    return table([new TableRow({ children })], widths);
  });
  return out;
}

/** Label/value pairs in columns, no rules (discharge summary meta). rows: [[{label,value}...]] */
function metaGrid(rows, o = {}) {
  return rows.map((cells) => {
    const widths = cells.map((c) => c.width || Math.floor(PAGE.content / cells.length));
    return table([new TableRow({ children: cells.map((c, i) => cell([
      label(c.label, { after: 30 }),
      para(runs(c.value, { size: 10 }), { line: 260 }),
    ], { width: widths[i], margins: pad(0, 140, 0, i < cells.length - 1 ? 200 : 0) })) })], widths);
  });
}

/** Key terms — label (slate) | value, with light rules between rows (offer letters, term sheets). */
function keyTerms(items, o = {}) {
  const lw = o.labelWidth || 2300;
  const rows = items.map((it, i) => new TableRow({ children: [
    cell(para(runs({ text: it.label, size: 10, weight: 'medium', color: C.slate }), { line: 280 }), {
      width: lw, margins: pad(120, 120, 0, 120),
      borders: { top: i === 0 ? line(C.navy, 6) : line(C.rule, 4), bottom: line(C.rule, 4), left: NONE, right: NONE },
    }),
    cell(para(runs(it.value, { size: 10 }), { line: 280 }), {
      width: PAGE.content - lw, margins: pad(120, 120, 0, 0),
      borders: { top: i === 0 ? line(C.navy, 6) : line(C.rule, 4), bottom: line(C.rule, 4), left: NONE, right: NONE },
    }),
  ] }));
  return table(rows, [lw, PAGE.content - lw]);
}

/**
 * Data table — navy header, white rows with light rules.
 * o.headers [..], o.rows [[..]], o.widths (sum = content), o.align (['left','right',...]),
 * o.accentFirstCol (magenta semibold numbers), o.navySecondCol (navy semibold), o.totalRows [idx], o.size
 */
function dataTable(o) {
  const n = o.headers.length;
  const widths = o.widths || splitWidths(n);
  const sz = o.size || 9.5;
  const alignOf = (i) => (o.align && o.align[i] === 'right' ? AlignmentType.RIGHT : o.align && o.align[i] === 'center' ? AlignmentType.CENTER : AlignmentType.LEFT);
  const head = new TableRow({ tableHeader: true, children: o.headers.map((h, i) => cell(
    para(runs({ text: h, size: sz, weight: 'semibold', color: C.white }), { align: alignOf(i), line: 260 }),
    { width: widths[i], fill: C.navy, margins: pad(150, 150, 160, 160), valign: VerticalAlign.CENTER },
  )) });
  const rows = o.rows.map((r, ri) => new TableRow({ children: r.map((v, i) => {
    const isTotal = o.totalRows && o.totalRows.includes(ri);
    let spec = { size: sz };
    if (isTotal) spec = { ...spec, weight: 'semibold', color: C.navy };
    else if (i === 0 && o.accentFirstCol) spec = { ...spec, weight: 'semibold', color: C.magenta };
    else if (i === 1 && o.navySecondCol) spec = { ...spec, weight: 'semibold', color: C.navy };
    else if (i === 0 && o.firstColSemibold) spec = { ...spec, weight: 'medium', color: C.ink };
    return cell(para(runs(v, spec), { align: alignOf(i), line: 280 }), {
      width: widths[i], fill: isTotal ? C.panel : undefined,
      margins: pad(120, 120, 160, 160), valign: VerticalAlign.CENTER,
      borders: { top: NONE, bottom: line(C.rule, 6), left: NONE, right: NONE },
    });
  }) }));
  return table([head, ...rows], widths);
}

/** Checklist — outlined checkbox + text. */
function checklist(items, o = {}) {
  const bw = 380;
  const rows = items.map((it) => new TableRow({ children: [
    cell(para([new TextRun('')]), { width: bw, margins: pad(0, 0, 0, 0), valign: VerticalAlign.TOP, borders: cellNoBorders,
      // inner box drawn as a nested 1-cell bordered table for crisp square corners
    }),
    cell(para(runs(it, { size: 10 }), { line: 300 }), { width: PAGE.content - bw - 200, margins: pad(0, 0, 200, 0) }),
  ] }));
  // replace first cells with box tables
  const boxed = items.map((it) => new TableRow({ children: [
    cell(table([new TableRow({ children: [cell(para([new TextRun({ text: '', size: 12 })], { line: 200 }), {
      width: 300, borders: { top: line(C.navy, 8), bottom: line(C.navy, 8), left: line(C.navy, 8), right: line(C.navy, 8) }, margins: pad(40, 40, 0, 0),
    })] })], [300]), { width: bw, margins: pad(30, 0, 0, 0) }),
    cell(para(runs(it, { size: 10 }), { line: 300 }), { width: PAGE.content - bw, margins: pad(0, 130, 0, 0) }),
  ] }));
  return table(boxed, [bw, PAGE.content - bw]);
}

/** Inline checkbox options in rows (e.g. incident types). items: strings; o.perRow (default 4) */
function checkboxRow(items, o = {}) {
  const per = o.perRow || 4;
  const chunks = [];
  for (let i = 0; i < items.length; i += per) chunks.push(items.slice(i, i + per));
  const widths = splitWidths(per);
  return chunks.map((ch) => table([new TableRow({ children: widths.map((w, i) => {
    const it = ch[i];
    if (!it) return cell(para([new TextRun('')]), { width: w });
    const inner = table([new TableRow({ children: [
      cell(table([new TableRow({ children: [cell(para([new TextRun({ text: '', size: 12 })], { line: 200 }), { width: 300, borders: { top: line(C.navy, 8), bottom: line(C.navy, 8), left: line(C.navy, 8), right: line(C.navy, 8) } })] })], [300]), { width: 380, margins: pad(30, 0, 0, 0) }),
      cell(para(runs(it, { size: 10 }), { line: 280 }), { width: w - 380 }),
    ] })], [380, w - 380]);
    return cell(inner, { width: w, margins: pad(0, 100, 0, 0) });
  }) })], widths));
}

/** Outlined option boxes in a row (severity scale). items: [{text, accent?}] */
function optionRow(items) {
  const gap = 200;
  const n = items.length;
  const widths = [];
  const children = [];
  const w = Math.floor((PAGE.content - gap * (n - 1)) / n);
  items.forEach((it, i) => {
    const col = it.accent ? C.magenta : C.rule;
    children.push(cell(para([
      new TextRun({ text: '○  ', font: F.fallback, size: 20, color: it.accent ? C.magenta : C.navy }),
      ...runs({ text: it.text, size: 10, weight: it.accent ? 'semibold' : 'regular', color: it.accent ? C.magenta : C.ink }),
    ], { line: 260 }), {
      width: w, margins: pad(140, 140, 200, 120),
      borders: { top: line(col, it.accent ? 10 : 6), bottom: line(col, it.accent ? 10 : 6), left: line(col, it.accent ? 10 : 6), right: line(col, it.accent ? 10 : 6) },
      valign: VerticalAlign.CENTER,
    }));
    widths.push(w);
    if (i < n - 1) { children.push(cell(para([new TextRun('')]), { width: gap })); widths.push(gap); }
  });
  return table([new TableRow({ children })], widths);
}

/** Labelled empty write-in box. o.label, o.heightPt (default 120) */
function textArea(o = {}) {
  const out = [];
  if (o.label) out.push(label(o.label, { after: 80 }));
  out.push(new Table({
    rows: [new TableRow({ height: { value: Math.round((o.heightPt || 120) * 20), rule: HeightRule.ATLEAST }, children: [
      cell(para([new TextRun('')]), { width: PAGE.content, borders: { top: line(C.rule, 8), bottom: line(C.rule, 8), left: line(C.rule, 8), right: line(C.rule, 8) }, margins: pad(120, 120, 160, 160) }),
    ] })],
    width: { size: PAGE.content, type: WidthType.DXA }, columnWidths: [PAGE.content], borders: noBorders, layout: TableLayoutType.FIXED,
  }));
  out.push(...spacer(1, 8));
  return out;
}

/**
 * Shaded panel. children: paragraphs/tables (or strings → body). o.fill 'grey'|'cream'|'navy', o.label (small caps)
 */
function panel(children, o = {}) {
  const fill = o.fill === 'cream' ? C.cream : o.fill === 'navy' ? C.navy : C.panel;
  const kids = (Array.isArray(children) ? children : [children]).map((k) => (typeof k === 'string' ? body(k, { after: 60 }) : k));
  const content = [];
  if (o.label) content.push(label(o.label, { after: 100, color: o.fill === 'navy' ? C.bandLabel : o.labelColor || C.slate }));
  content.push(...kids);
  return table([new TableRow({ children: [cell(content, { width: PAGE.content, fill, margins: pad(260, 220, 300, 300) })] })], [PAGE.content]);
}

/** Navy alert band: text left, big value right (emergency numbers, deadlines). */
function alertBand(text, value, o = {}) {
  const vw = o.valueWidth || 3200;
  return table([new TableRow({ children: [
    cell(para(runs(text, { size: 10, color: C.white }), { line: 280 }), { width: PAGE.content - vw, fill: C.navy, margins: pad(260, 260, 300, 200), valign: VerticalAlign.CENTER }),
    cell(para(runs({ text: value, size: 15, weight: 'semibold', color: C.white }), { align: AlignmentType.RIGHT, line: 280 }), { width: vw, fill: C.navy, margins: pad(260, 260, 100, 300), valign: VerticalAlign.CENTER }),
  ] })], [PAGE.content - vw, vw]);
}

/** Side-by-side grey cards with magenta labels. items: [{label, bullets:[..] | paras:[..]}] */
function cards(items, o = {}) {
  const gap = 300;
  const n = items.length;
  const w = Math.floor((PAGE.content - gap * (n - 1)) / n);
  const widths = []; const children = [];
  items.forEach((it, i) => {
    const content = [label(it.label, { color: C.magenta, after: 120 })];
    if (it.bullets) content.push(...bullets(it.bullets, { after: 40 }));
    if (it.paras) content.push(...it.paras.map((p) => (typeof p === 'string' ? body(p, { after: 60 }) : p)));
    children.push(cell(content, { width: w, fill: it.fill === 'cream' ? C.cream : C.panel, margins: pad(280, 240, 300, 280) }));
    widths.push(w);
    if (i < n - 1) { children.push(cell(para([new TextRun('')]), { width: gap })); widths.push(gap); }
  });
  return table([new TableRow({ children, cantSplit: true })], widths);
}

/** Cream quote box (press releases, reports). */
function quote(text, attribution) {
  const content = [para(runs({ text: `“${text}”`, size: 12, color: C.navy }), { line: 300, after: attribution ? 120 : 0 })];
  if (attribution) content.push(para(runs({ text: attribution, size: 9.5, color: C.slate }), { line: 240 }));
  return table([new TableRow({ children: [cell(content, { width: PAGE.content, fill: C.cream, margins: pad(300, 280, 300, 300) })] })], [PAGE.content]);
}

/** KPI strip — big navy numbers with slate labels, separated by rules. items: [{value,label}] */
function kpiStrip(items, o = {}) {
  const widths = splitWidths(items.length);
  return table([new TableRow({ children: items.map((it, i) => cell([
    para(runs({ text: it.value, size: o.valueSize || 20, weight: 'light', color: C.navy }), { line: 260, after: 40 }),
    para(runs({ text: it.label, size: 8.5, color: C.slate }), { line: 240 }),
  ], { width: widths[i], margins: pad(160, 160, i === 0 ? 0 : 220, 160), borders: { top: line(C.navy, 6), bottom: line(C.rule, 6), left: i === 0 ? NONE : line(C.rule, 6), right: NONE } })) })], widths);
}

/** Two-column editorial spread: big statement left, detail right (reports, strategy notes). */
function spread(statementText, rightBlocks, o = {}) {
  const lw = o.leftWidth || 3700;
  const gap = 400;
  const right = (Array.isArray(rightBlocks) ? rightBlocks : [rightBlocks]).map((b) => (typeof b === 'string' ? body(b) : b));
  return table([new TableRow({ children: [
    cell(statement(statementText, { size: o.size || 18 }), { width: lw }),
    cell(para([new TextRun('')]), { width: gap }),
    cell(right, { width: PAGE.content - lw - gap }),
  ] })], [lw, gap, PAGE.content - lw - gap]);
}

// ---------------------------------------------------------------------------
// Signature blocks
// ---------------------------------------------------------------------------
/**
 * Two (or more) signature columns with navy top rule.
 * parties: [{for: 'FOR LAKESHORE HOSPITAL & RESEARCH CENTRE LTD', lines: ['Name: ____', ...]}]
 */
function signatures(parties, o = {}) {
  const gap = 400;
  const n = parties.length;
  const w = Math.floor((PAGE.content - gap * (n - 1)) / n);
  const widths = []; const children = [];
  parties.forEach((p, i) => {
    const content = [
      para([new TextRun({ text: '', size: 2 })], { border: { top: line(C.navy, 8) }, after: 160, line: 120 }),
      para(runs({ text: p.for, size: 8, weight: 'medium', caps: true, tracking: 30, color: C.slate }), { after: o.gapAfterLabel ?? 320, line: 260 }),
      ...(p.lines || (n >= 3 ? ['Name: ______________', 'Designation: ________', 'Date: ______________'] : ['Name: ____________________', 'Designation: ______________', 'Date: ____________________'])).map((l) => para(runs({ text: l, size: 10 }), { line: 280, after: 40 })),
    ];
    children.push(cell(content, { width: w })); widths.push(w);
    if (i < n - 1) { children.push(cell(para([new TextRun('')]), { width: gap })); widths.push(gap); }
  });
  return table([new TableRow({ children, cantSplit: true })], widths);
}

/** Letter sign-off columns: [{name, title}] — name navy semibold, title ink. */
function signoff(people, o = {}) {
  const widths = splitWidths(people.length);
  return table([new TableRow({ children: people.map((p, i) => cell([
    para(runs({ text: p.name, size: 10.5, weight: 'semibold', color: C.navy }), { line: 260, after: 20 }),
    para(runs({ text: p.title, size: 10 }), { line: 260 }),
    ...(p.extra ? [para(runs({ text: p.extra, size: 9.5, color: C.slate }), { line: 260 })] : []),
  ], { width: widths[i] })), cantSplit: true })], widths);
}

/** Grey acceptance / countersign line under a rule. */
const acceptanceLine = (text) => para(runs({ text, size: 9.5, color: C.slate }), { border: { top: line(C.rule, 6) }, before: 200, after: 0, line: 300 });

/** Signature panel in a grey box, three columns (consent forms). cols: [{label, lines:[..]}] */
function signaturePanel(cols) {
  const widths = splitWidths(cols.length);
  const row = new TableRow({ children: cols.map((c, i) => cell([
    label(c.label, { after: 200 }),
    ...c.lines.map((l) => para(runs({ text: l, size: 9.5 }), { line: 280, after: 20 })),
  ], { width: widths[i], fill: C.panel, margins: pad(240, 240, i === 0 ? 260 : 120, 120) })), cantSplit: true });
  return table([row], widths);
}

// ---------------------------------------------------------------------------
// Footers & headers (section-level)
// ---------------------------------------------------------------------------
/** Standard footer: grey rule, slate note left, "n / N" right. */
function footerStandard(leftText, o = {}) {
  return new Footer({ children: [
    para([
      ...runs({ text: leftText || '', size: 8.5, color: C.slate }),
      new TextRun({ text: '\t' }),
      new TextRun({ children: [PageNumber.CURRENT], font: F.regular, size: 17, color: C.slate }),
      new TextRun({ text: ' / ', font: F.regular, size: 17, color: C.slate }),
      new TextRun({ children: [PageNumber.TOTAL_PAGES], font: F.regular, size: 17, color: C.slate }),
    ], { tabStops: [{ type: TabStopType.RIGHT, position: o.width || PAGE.content }], border: { top: line(C.rule, 6) }, before: 0, after: 0, line: 300 }),
  ] });
}

/** Two-text footer without page numbers (press release "— Ends —"). */
function footerPlain(leftText, rightText, o = {}) {
  return new Footer({ children: [
    para([...runs({ text: leftText || '', size: 8.5, color: C.slate }), new TextRun({ text: '\t' }), ...runs({ text: rightText || '', size: 8.5, color: C.slate })],
      { tabStops: [{ type: TabStopType.RIGHT, position: o.width || PAGE.content }], border: { top: line(C.rule, 6) }, before: 0, after: 0, line: 300 }),
  ] });
}

/** Full-bleed cream footer band (letters, circulars). left: run specs; right: text */
function footerBand(left, right, o = {}) {
  const fill = o.fill === 'navy' ? C.navy : C.cream;
  const tc = o.fill === 'navy' ? C.white : C.ink;
  const rc = o.fill === 'navy' ? C.bandLabel : C.slate;
  const row = new TableRow({ children: [
    cell(para(runs(left, { size: 9, color: tc }), { line: 260 }), { width: Math.floor(PAGE.width / 2), fill, margins: pad(300, 300, PAGE.margin.left, 0), valign: VerticalAlign.CENTER }),
    cell(para(runs({ text: right || '', size: 9, color: rc }), { align: AlignmentType.RIGHT, line: 260 }), { width: PAGE.width - Math.floor(PAGE.width / 2), fill, margins: pad(300, 300, 0, PAGE.margin.right), valign: VerticalAlign.CENTER }),
  ] });
  const f = new Footer({ children: [table([row], [Math.floor(PAGE.width / 2), PAGE.width - Math.floor(PAGE.width / 2)], { indent: -PAGE.margin.left })] });
  f.__lakeshoreBand = true;
  return f;
}

/** Small running header for continuation pages (optional): slate text left, doc ref right. Pass {width: L.PAGE.landscapeContent} in landscape sections. */

  return new Header({ children: [para([...runs({ text: left || '', size: 8, color: C.slate }), new TextRun({ text: '\t' }), ...runs({ text: right || '', size: 8, color: C.slate })],
    { tabStops: [{ type: TabStopType.RIGHT, position: o.width || PAGE.content }], after: 0, line: 240 })] });
}

// Cover (reports / strategy notes) & certificate frame

/**
 * Full-page navy cover. Put it in its OWN section with `fullBleed: true` (zero margins), e.g.
 *   { children: L.cover({...}), fullBleed: true }
 * o.kicker (small caps), o.title (cream light 34pt, \n for breaks), o.subtitle (white 13pt light),
 * o.meta [{label,value}], o.confidential (string | false)
 */
function cover(o = {}) {
  const inner = PAGE.content;
  const top = [para([logoWhite(230)], { line: 240, after: 0 })];
  const mid = [];
  if (o.kicker) mid.push(para(runs({ text: o.kicker, size: 8.5, weight: 'medium', caps: true, tracking: 40, color: C.bandLabel }), { after: 300, line: 240 }));
  const tl = String(o.title || '').split('\n'); const tr = [];
  tl.forEach((t, i) => tr.push(...runs({ text: t, size: o.titleSize || 34, weight: 'light', color: C.cream, break: i > 0 })));
  mid.push(para(tr, { line: 250, after: 260 }));
  if (o.subtitle) mid.push(para(runs({ text: o.subtitle, size: 13, weight: 'light', color: C.white }), { line: 320, after: 0 }));
  const bottom = [];
  if (o.meta && o.meta.length) {
    bottom.push(para([new TextRun({ text: '', size: 2 })], { border: { bottom: line(C.bandRule, 4) }, after: 160, line: 120 }));
    const widths = splitWidths(o.meta.length, inner);
    bottom.push(table([new TableRow({ children: o.meta.map((m, i) => cell([
      para(runs({ text: m.label, size: 7.5, weight: 'medium', caps: true, tracking: 30, color: C.bandLabel }), { after: 40, line: 240 }),
      para(runs({ text: m.value, size: 10, color: C.white }), { line: 260 }),
    ], { width: widths[i], margins: pad(0, 0, 0, 200) })) })], widths));
  }
  if (o.confidential !== false) bottom.push(para(runs({ text: o.confidential || 'Strictly confidential · Prepared for internal circulation', size: 8.5, color: C.bandLabel }), { before: 300, line: 240 }));
  const h = PAGE.height - 120; // leave a hair so the table never spills to a second page
  const side = pad(0, 0, PAGE.margin.left + 400, PAGE.margin.right + 400);
  const rows = [
    new TableRow({ height: { value: Math.round(h * 0.18), rule: HeightRule.EXACT }, children: [cell(top, { width: PAGE.width, fill: C.navy, margins: { ...side, top: 1300 }, valign: VerticalAlign.TOP })] }),
    new TableRow({ height: { value: Math.round(h * 0.52), rule: HeightRule.EXACT }, children: [cell(mid, { width: PAGE.width, fill: C.navy, margins: side, valign: VerticalAlign.CENTER })] }),
    new TableRow({ height: { value: Math.round(h * 0.30), rule: HeightRule.EXACT }, children: [cell(bottom, { width: PAGE.width, fill: C.navy, margins: { ...side, bottom: 1200 }, valign: VerticalAlign.BOTTOM })] }),
  ];
  return [new Table({ rows, width: { size: PAGE.width, type: WidthType.DXA }, columnWidths: [PAGE.width], borders: noBorders, layout: TableLayoutType.FIXED })];
}

/** Section-page for reports: kicker + rule at top, big navy statement, optional body. */
function sectionOpener(o = {}) {
  const out = [];
  out.push(para(runs({ text: o.kicker, size: 8, weight: 'medium', caps: true, tracking: 40, color: C.navy }), { after: 100, line: 240, pageBreakBefore: o.pageBreak !== false }));
  out.push(para([new TextRun({ text: '', size: 2 })], { border: { bottom: line(C.navy, 6) }, after: 700, line: 120 }));
  if (o.title) out.push(statement(o.title, { size: o.size || 26, after: 300 }));
  if (o.intro) out.push(...(Array.isArray(o.intro) ? o.intro : [o.intro]).map((t) => (typeof t === 'string' ? para(runs({ text: t, size: 12, weight: 'light', color: C.slate }), { line: 320, after: 160 }) : t)));
  return out;
}

// ---------------------------------------------------------------------------
// Document assembly
// ---------------------------------------------------------------------------
function embeddedFonts() {
  const dir = path.join(ASSETS, 'fonts');
  const list = [
    ['DM Sans', 'DMSans.ttf'], ['DM Sans Italic', 'DMSansItalic.ttf'], ['DM Sans Light', 'DMSansLight.ttf'],
    ['DM Sans Medium', 'DMSansMedium.ttf'], ['DM Sans SemiBold', 'DMSansSemiBold.ttf'],
  ];
  return list.filter(([, f]) => fs.existsSync(path.join(dir, f))).map(([name, f]) => ({ name, data: fs.readFileSync(path.join(dir, f)) }));
}

/**
 * Build the Document.
 * o.sections: [{ children:[...], footer: Footer|undefined, header: Header|undefined, firstFooter, orientation, pageBorder:boolean, margin:{...} }]
 * o.embedFonts (default true), o.title, o.creator
 */
function buildDoc(o) {
  const sections = o.sections.map((s) => {
    const landscape = s.orientation === 'landscape';
    const m = { ...PAGE.margin, ...(s.margin || {}) };
    if (s.firstHeader && s.firstHeader.__lakeshoreBand) { m.header = 0; m.top = Math.max(m.top, 1077); }
    if (s.fullBleed) { m.top = 0; m.bottom = 0; m.left = 0; m.right = 0; m.header = 0; m.footer = 0; }
    const props = {
      page: {
        size: landscape ? { width: PAGE.height, height: PAGE.width } : { width: PAGE.width, height: PAGE.height },
        margin: m,
        borders: s.pageBorder ? {
          pageBorderTop: { style: BorderStyle.SINGLE, size: 8, color: C.navy, space: 24 },
          pageBorderBottom: { style: BorderStyle.SINGLE, size: 8, color: C.navy, space: 24 },
          pageBorderLeft: { style: BorderStyle.SINGLE, size: 8, color: C.navy, space: 24 },
          pageBorderRight: { style: BorderStyle.SINGLE, size: 8, color: C.navy, space: 24 },
        } : undefined,
      },
      titlePage: (s.firstFooter || s.firstHeader) ? true : undefined, // never emit titlePg=false (LibreOffice misreads it)
    };
    // Always set explicit headers/footers so a section never inherits ("links to") the previous one.
    const empty = () => new Header({ children: [para([new TextRun({ text: '', size: 2 })], { line: 240 })] });
    const emptyF = () => new Footer({ children: [para([new TextRun({ text: '', size: 2 })], { line: 240 })] });
    if (s.fullBleed) return { properties: props, children: s.children }; // cover pages: no chrome at all
    const headers = { default: s.header || empty() };
    const footers = { default: s.footer || emptyF() };
    if (props.titlePage) {
      headers.first = s.firstHeader || s.header || empty();
      footers.first = s.firstFooter || s.footer || emptyF();
    }
    if ((s.footer && s.footer.__lakeshoreBand) || (s.firstFooter && s.firstFooter.__lakeshoreBand)) m.footer = 0;
    return { properties: props, headers, footers, children: s.children };
  });

  return new Document({
    creator: o.creator || 'VPS Lakeshore',
    title: o.title || '',
    fonts: o.embedFonts === false ? undefined : embeddedFonts(),
    styles: {
      default: { document: { run: { font: F.regular, size: 20, color: C.ink } } },
      paragraphStyles: [
        { id: 'Normal', name: 'Normal', run: { font: F.regular, size: 20, color: C.ink }, paragraph: { spacing: { line: 300, lineRule: LineRuleType.AUTO, after: 120 } } },
        { id: 'Heading1', name: 'Heading 1', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { font: F.regular, size: 40, color: C.navy }, paragraph: { spacing: { before: 0, after: 120 } } },
        { id: 'Heading2', name: 'Heading 2', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { font: F.semibold, size: 23, color: C.navy }, paragraph: { spacing: { before: 200, after: 80 }, keepNext: true } },
        { id: 'Heading3', name: 'Heading 3', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { font: F.medium, size: 21, color: C.navy }, paragraph: { spacing: { before: 140, after: 60 }, keepNext: true } },
      ],
    },
    numbering: {
      config: [
        { reference: 'lk-bullets', levels: [{ level: 0, format: LevelFormat.BULLET, text: '•', alignment: AlignmentType.LEFT,
          style: { run: { font: F.regular, color: C.navy }, paragraph: { indent: { left: 440, hanging: 260 } } } }] },
        { reference: 'lk-numbers', levels: [{ level: 0, format: LevelFormat.DECIMAL, text: '%1.', alignment: AlignmentType.LEFT,
          style: { run: { font: F.semibold, color: C.magenta }, paragraph: { indent: { left: 520, hanging: 520 } } } }] },
      ],
    },
    sections,
  });
}

/** Write the Document to disk (normalises embedded-font GUIDs to the upper-case form the OOXML schema expects). */
async function save(doc, outPath) {
  let buf = await Packer.toBuffer(doc);
  try {
    const JSZip = require(path.join(path.dirname(require.resolve('docx')), '..', 'node_modules', 'jszip'));
    const zip = await JSZip.loadAsync(buf);
    const ft = zip.file('word/fontTable.xml');
    if (ft) {
      let xml = await ft.async('string');
      xml = xml.replace(/w:fontKey="\{([0-9a-fA-F-]+)\}"/g, (m, g) => `w:fontKey="{${g.toUpperCase()}}"`);
      zip.file('word/fontTable.xml', xml);
      buf = await zip.generateAsync({ type: 'nodebuffer', compression: 'DEFLATE' });
    }
  } catch (e) { /* jszip unavailable — keep original buffer */ }
  fs.writeFileSync(outPath, buf);
  return outPath;
}

module.exports = {
  C, F, PAGE, LOGO, ORG,
  // primitives
  runs, para, cell, table, image, logoColour, logoWhite, splitWidths, pageBreak, spacer,

  label, kicker, title, h2, h3, body, lead, muted, standfirst, statement, bullets, numbered, divider, navyRule,
  // header blocks
  pill, masthead, letterhead, refLine, addressee, subject, bandHeader, cover, sectionOpener,
  // data / form
  clauses, fieldGrid, metaGrid, keyTerms, dataTable, checklist, checkboxRow, optionRow, textArea, panel, alertBand, cards, quote, kpiStrip, spread,
  // signatures
  signatures, signoff, acceptanceLine, signaturePanel,
  // section chrome
  footerStandard, footerPlain, footerBand, runningHeader,
  // assembly
  buildDoc, save,
  docx: require('docx'),
};

}
/* Word export in the VPS Lakeshore house style.
 *
 * Uses the brand's own component library (vendor/lakeshore_docx.js, the same file the
 * vps-*-docx skills use) on top of docx.js. The build wraps that file in
 * __lakeshoreFactory(require, module, exports, __dirname, process); here we give it a
 * tiny in-memory "fs" holding the logo and DM Sans fonts, fetched from the files
 * published beside the page.
 */
"use strict";

const LKWord = (() => {
  const ASSET_FILES = {
    "logo-lakeshore-colour.png": "brand/logo-lakeshore-colour.png",
    "logo-lakeshore-white.png": "brand/logo-lakeshore-white.png",
    "DMSans.ttf": "fonts/DMSans.ttf",
    "DMSansItalic.ttf": "fonts/DMSansItalic.ttf",
    "DMSansLight.ttf": "fonts/DMSansLight.ttf",
    "DMSansMedium.ttf": "fonts/DMSansMedium.ttf",
    "DMSansSemiBold.ttf": "fonts/DMSansSemiBold.ttf",
  };

  let libPromise = null;

  /** Build the library once. `docxLib` is the docx.js namespace; `fetchBytes(relPath)` returns a Uint8Array. */
  function load(docxLib, fetchBytes) {
    if (libPromise) return libPromise;
    libPromise = (async () => {
      const bytes = {};
      await Promise.all(Object.entries(ASSET_FILES).map(async ([name, rel]) => {
        try { bytes[name] = await fetchBytes(rel); } catch (_) { /* a missing font only loses embedding */ }
      }));
      const base = (p) => String(p).split("/").pop();
      const fs = {
        existsSync: (p) => base(p) in bytes,
        readFileSync: (p) => { const b = bytes[base(p)]; if (!b) throw new Error("missing " + p); return b; },
        writeFileSync: () => { throw new Error("not available in the browser"); },
      };
      const path = {
        join: (...a) => a.join("/").replace(/\/+/g, "/"),
        dirname: (p) => String(p).split("/").slice(0, -1).join("/") || "/",
      };
      const req = (name) => {
        if (name === "fs") return fs;
        if (name === "path") return path;
        if (name === "docx") return docxLib;
        throw new Error("Cannot load " + name);
      };
      req.resolve = () => "/lk/node_modules/docx/index.js";
      const module = { exports: {} };
      __lakeshoreFactory(req, module, module.exports, "/lk/scripts", { cwd: () => "/lk" });
      return module.exports;
    })();
    return libPromise;
  }

  const TABLE_SEP = /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  const plain = (t) => String(t).replace(/\*\*|`/g, "").trim();

  /** Markdown inline marks -> run specs understood by L.runs(). */
  function inline(text, base = {}) {
    const out = [];
    const re = /(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|`[^`]+`|\[[^\]\n]{2,80}\](?!\())/g;
    let last = 0, m;
    const push = (t, extra) => { if (t) out.push({ ...base, text: t, ...extra }); };
    while ((m = re.exec(text))) {
      push(text.slice(last, m.index));
      const p = m[0];
      if (p.startsWith("**")) push(p.slice(2, -2), { weight: "semibold", color: base.color || "001E5F" });
      else if (p.startsWith("`")) push(p.slice(1, -1), { weight: "medium" });
      else if (p.startsWith("[")) push(p, { weight: "semibold" });
      else push(p.slice(1, -1), { italic: true });
      last = m.index + p.length;
    }
    push(text.slice(last));
    return out.length ? out : [{ ...base, text: "" }];
  }

  function cells(line) {
    let l = line.trim();
    if (l.startsWith("|")) l = l.slice(1);
    if (l.endsWith("|")) l = l.slice(0, -1);
    return l.split("|").map((c) => c.trim());
  }

  /** Split a width into n columns that sum exactly to total. */
  function widths(n, total, firstNarrow) {
    if (firstNarrow && n > 2) {
      const first = 700, rest = Math.floor((total - first) / (n - 1));
      const w = [first, ...Array(n - 1).fill(rest)];
      w[n - 1] += total - w.reduce((a, b) => a + b, 0);
      return w;
    }
    const w = Array(n).fill(Math.floor(total / n));
    w[n - 1] += total - w.reduce((a, b) => a + b, 0);
    return w;
  }

  /**
   * Convert the assistant's Markdown into Lakeshore blocks.
   * meta: {title, kicker, pill, footer, company}
   */
  function toBlocks(L, markdown, meta) {
    let lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
    let title = meta.title || "Document";
    const firstIdx = lines.findIndex((l) => l.trim());
    if (firstIdx >= 0) {
      const m = lines[firstIdx].trim().match(/^#\s+(.*)$/);
      if (m) { title = plain(m[1]); lines = lines.slice(firstIdx + 1); }
    }
    const blocks = [];
    blocks.push(...L.masthead({ kicker: meta.kicker, pill: meta.pill ? { text: meta.pill, style: "outline" } : undefined, title, rule: "navy" }));
    const d = new Date();
    const today = `${d.getDate()} ${d.toLocaleString("en-GB", { month: "long" })} ${d.getFullYear()}`;
    blocks.push(...L.metaGrid([[
      ...(meta.company ? [{ label: "Company", value: meta.company }] : []),
      { label: "Prepared by", value: "Company Secretariat & Legal" },
      { label: "Date", value: today },
      { label: "Status", value: meta.status || "Draft for review" },
    ]]));
    blocks.push(...L.spacer(1, 8));

    let afterVerdict = false;
    let i = 0;
    while (i < lines.length) {
      const raw = lines[i], s = raw.trim();
      if (!s) { i++; continue; }
      if (s.startsWith("|") && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1].trim())) {
        const head = cells(s).map(plain);
        const rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().startsWith("|")) {
          const r = cells(lines[i]).map(plain);
          while (r.length < head.length) r.push("");
          rows.push(r.slice(0, head.length));
          i++;
        }
        const numbered = rows.length && rows.every((r) => /^\d{1,3}\.?$/.test(r[0] || ""));
        blocks.push(L.dataTable({ headers: head, rows, widths: widths(head.length, L.PAGE.content, numbered), accentFirstCol: numbered }));
        blocks.push(...L.spacer(1, 6));
        continue;
      }
      let m = s.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        afterVerdict = plain(m[2]).toLowerCase() === "verdict";
        if (!afterVerdict) blocks.push(m[1].length <= 2 ? L.h2(plain(m[2])) : L.h3(plain(m[2])));
        i++; continue;
      }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(s)) { blocks.push(L.divider()); i++; continue; }
      if (/^\s*[-*+]\s+/.test(raw)) {
        const items = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          const depth = Math.floor(lines[i].match(/^\s*/)[0].length / 2);
          items.push(inline((depth ? "– " : "") + lines[i].replace(/^\s*[-*+]\s+/, "")));
          i++;
        }
        blocks.push(...L.bullets(items));
        continue;
      }
      if (/^\s*\d+(\.\d+)*[.)]\s+/.test(raw)) {
        const items = [];
        let start = null;
        while (i < lines.length && /^\s*(\d+(\.\d+)*|[a-z]|[ivx]+)[.)]\s+/.test(lines[i])) {
          const mm = lines[i].match(/^\s*(\d+(?:\.\d+)*|[a-z]|[ivx]+)[.)]\s+(.*)$/);
          if (start === null) start = parseInt(mm[1], 10) || 1;
          const t = mm[2];
          const tm = t.match(/^\*\*([^*]+)\*\*\s*(.*)$/);
          const sub = !/^\d/.test(mm[1]);
          if (sub && items.length) {
            // House style: sub-points run inline as (a), (b) inside their clause.
            items[items.length - 1].text.push({ text: ` (${mm[1]}) ` }, ...inline(t));
          } else {
            items.push(tm ? { title: plain(tm[1]), text: inline(tm[2]) } : { text: inline(t) });
          }
          i++;
        }
        blocks.push(L.clauses(items, { start }));
        blocks.push(...L.spacer(1, 4));
        continue;
      }
      if (s.startsWith(">")) {
        const buf = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) buf.push(lines[i++].trim().replace(/^>\s?/, ""));
        blocks.push(L.panel([L.body(inline(buf.join(" ")))], { fill: "cream" }));
        blocks.push(...L.spacer(1, 6));
        continue;
      }
      const buf = [s];
      i++;
      while (i < lines.length && lines[i].trim() && !/^(#|\||[-*+]\s|\d+[.)]\s|>)/.test(lines[i].trim())) buf.push(lines[i++].trim());
      const text = buf.join(" ");
      const v = plain(text).match(/^(GREEN|AMBER|RED)\b/);
      if (v || afterVerdict) {
        const fill = v && v[1] === "RED" ? "grey" : "cream";
        blocks.push(L.panel([L.body(inline(text, v && v[1] === "RED" ? { color: "B5175A" } : {}))], { fill, label: "Verdict" }));
        blocks.push(...L.spacer(1, 6));
        afterVerdict = false;
        continue;
      }
      blocks.push(L.body(inline(text)));
    }
    return { blocks, title };
  }

  /**
   * Markdown -> .docx bytes. `pack(doc)` returns the zip (Blob or Buffer); `JSZip` is used to
   * upper-case the embedded-font keys, as the OOXML schema requires (docx.js writes them in
   * lower case, and Word/LibreOffice then ignore the embedded DM Sans).
   */
  async function build(L, markdown, meta, pack, JSZip) {
    const { blocks, title } = toBlocks(L, markdown, meta);
    const doc = L.buildDoc({ title, creator: meta.company || "VPS Lakeshore", sections: [{ children: blocks, footer: L.footerStandard(meta.footer) }] });
    const raw = await pack(doc);
    const zip = await JSZip.loadAsync(raw);
    const ft = zip.file("word/fontTable.xml");
    if (ft) {
      const xml = await ft.async("string");
      zip.file("word/fontTable.xml", xml.replace(/w:fontKey="\{([0-9a-fA-F-]+)\}"/g, (m, g) => `w:fontKey="{${g.toUpperCase()}}"`));
    }
    const data = await zip.generateAsync({ type: "uint8array", compression: "DEFLATE",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    return { data, title };
  }

  return { load, toBlocks, build };
})();

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function cutToBytes(text, max) {
  if (bytes(text) <= max) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (bytes(text.slice(0, mid)) <= max) lo = mid; else hi = mid - 1; }
  return text.slice(0, lo);
}

const scriptCache = {};
function loadScript(url) {
  if (!scriptCache[url]) {
    scriptCache[url] = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = url; s.async = false;
      s.onload = resolve;
      s.onerror = () => { delete scriptCache[url]; reject(new Error("Could not load a component from the internet. Check the connection and try again.")); };
      document.head.appendChild(s);
    });
  }
  return scriptCache[url];
}
async function need(name) { for (const u of LIBS[name]) await loadScript(u); }

function fontSize(step) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--base")) || 19;
  const next = Math.min(28, Math.max(15, cur + step * 2));
  document.documentElement.style.setProperty("--base", next + "px");
  try { localStorage.setItem("cs-font", String(next)); } catch (_) { /* storage blocked */ }
}
try { const f = localStorage.getItem("cs-font"); if (f) document.documentElement.style.setProperty("--base", f + "px"); } catch (_) { /* ignore */ }

/* ================================================================= markdown */
function inlineMd(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function splitRow(line) {
  let l = line.trim();
  if (l.startsWith("|")) l = l.slice(1);
  if (l.endsWith("|")) l = l.slice(0, -1);
  return l.split("|").map((c) => c.trim());
}
function md(text) {
  const lines = (text || "").replace(/\r\n/g, "\n").split("\n");
  let out = "", i = 0;
  const isSep = (l) => /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l.trim());
  const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  while (i < lines.length) {
    const line = lines[i], t = line.trim();
    if (!t) { i++; continue; }
    if (t.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    let m = t.match(/^(#{1,6})\s+(.*)$/);
    if (m) { const n = Math.min(m[1].length, 4); out += `<h${n}>${inlineMd(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { out += "<hr>"; i++; continue; }
    if (t.startsWith("|") && i + 1 < lines.length && isSep(lines[i + 1])) {
      const head = splitRow(t); i += 2;
      let rows = "";
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        const cells = splitRow(lines[i++]);
        rows += "<tr>" + head.map((_, j) => `<td>${inlineMd(cells[j] ?? "")}</td>`).join("") + "</tr>";
      }
      out += `<div class="tablewrap"><table><thead><tr>${head.map((c) => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }
    if (LI.test(line)) {
      const items = [];
      while (i < lines.length && (LI.test(lines[i]) || (items.length && /^\s{2,}\S/.test(lines[i]) && !LI.test(lines[i])))) {
        const m2 = lines[i].match(LI);
        if (m2) items.push({ lvl: Math.min(3, Math.floor(m2[1].length / 2)), ordered: /\d/.test(m2[2]), num: parseInt(m2[2], 10), text: m2[3] });
        else items[items.length - 1].text += " " + lines[i].trim();
        i++;
      }
      const stack = [];
      let html = "";
      for (const it of items) {
        while (stack.length > it.lvl + 1) html += `</li></${stack.pop()}>`;
        if (stack.length === it.lvl + 1) html += "</li>";
        while (stack.length < it.lvl + 1) {
          const tag = it.ordered ? "ol" : "ul";
          html += it.ordered && it.num > 1 ? `<ol start="${it.num}">` : `<${tag}>`;
          stack.push(tag);
        }
        html += `<li>${inlineMd(it.text)}`;
      }
      while (stack.length) html += `</li></${stack.pop()}>`;
      out += html;
      continue;
    }
    if (t.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].trim().startsWith(">")) buf.push(lines[i++].trim().replace(/^>\s?/, ""));
      out += `<blockquote>${inlineMd(buf.join(" "))}</blockquote>`; continue;
    }
    const buf = [t]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#|\||```|>|\s*([-*+]|\d+[.)])\s)/.test(lines[i].trim())) buf.push(lines[i++].trim());
    const para = buf.join(" ");
    const v = para.replace(/\*/g, "").match(/^(GREEN|AMBER|RED)\b/);
    out += v ? `<div class="verdict ${v[1].toLowerCase()}">${inlineMd(para)}</div>` : `<p>${inlineMd(para)}</p>`;
  }
  return out;
}

function dbError(e) {

  if (code === "quota_exceeded") return "The page's storage is full. An editor needs to remove old documents first.";
  if (code === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  return "The change could not be saved. Check the connection and try again.";
}

function subscribe() {

  db.doc("settings/company").onSnapshot((d) => { S.profile = d.exists ? d.data() : null; S.loaded.profile = true; rerender("profile"); }, onErr);
  db.doc("calendar/agm").onSnapshot((d) => { S.agm = (d.exists && d.data().dates) || {}; rerender("calendar"); }, onErr);

/* ================================================================ calendar */
const fyLabel = (y) => `${y}-${String(y + 1).slice(-2)}`;
const currentFy = (d) => (d.getMonth() + 1 >= 4 ? d.getFullYear() : d.getFullYear() - 1);
function safeDate(y, m, d) { const last = new Date(y, m, 0).getDate(); return iso(new Date(y, m - 1, Math.min(d, last))); }
function periodOf(item, y) {
  return item.period_fmt.replace("{fy}", fyLabel(y)).replace("{pfy}", fyLabel(y - 1)).replace("{y}", String(y)).replace("{py}", String(y - 1));
}
function occurrences(fy, flags, agmIso) {
  const agm = agmIso || `${fy}-09-30`;
  const out = [];
  for (const it of DATA.items) {
    if (it.applies_if && !flags[it.applies_if]) continue;
    if (it.category === "tax_labour" && !flags.track_tax_labour) continue;
    const [kind, arg] = it.rule;
    if (kind === "dates") {
      for (const [m, d, label] of arg) {
        const y = m >= 4 ? fy : fy + 1;
        const period = label ? label.replace("{y}", String(fy)).replace("{y1}", String(fy + 1)) : periodOf(it, fy);
        out.push({ item: it, due: safeDate(y, m, d), period });
      }
    } else if (kind === "monthly") {
      for (let n = 0; n < 12; n++) {
        const pm = ((4 + n - 1) % 12) + 1;
        const py = pm >= 4 ? fy : fy + 1;
        const dm = (pm % 12) + 1;
        const dy = pm === 12 ? py + 1 : py;
        const day = it.id === "tds_deposit" && pm === 3 ? 30 : arg;
        out.push({ item: it, due: safeDate(dy, dm, day), period: `for ${MONTHS[pm - 1]} ${py}` });
      }
    } else if (kind === "agm_plus") {
      const d = parseIso(agm); d.setDate(d.getDate() + arg);
      out.push({ item: it, due: iso(d), period: periodOf(it, fy), agmBased: true });
    } else if (kind === "fy_start_plus") {
      const d = new Date(fy, 3, 1); d.setDate(d.getDate() + arg);
      out.push({ item: it, due: iso(d), period: periodOf(it, fy) });
    }
  }
  for (const o of out) o.key = `${o.item.id}@${o.due}`;
  out.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.item.title.localeCompare(b.item.title)));
  return out;
}
function statusFor(due, today, done) {
  if (done) return ["done", "Done"];
  const days = daysBetween(today, due);
  if (days < 0) return ["overdue", `Overdue by ${-days} day${days === -1 ? "" : "s"}`];
  if (days === 0) return ["today", "Due today"];
  if (days <= 15) return ["soon", `Due in ${days} day${days === 1 ? "" : "s"}`];
  if (days <= 45) return ["upcoming", `Due in ${days} days`];
  return ["later", `Due in ${days} days`];
}
function calendarRows(fy) {
  const p = profile();
  const today = todayIso();
  const since = p.tracking_since || today;
  const row = (o) => {
    const done = S.filings[o.key];
    let [code, label] = statusFor(o.due, today, !!done);
    if (!done && o.due < since) { code = "untracked"; label = "Before tracking started"; }
    return { ...o, status: code, label, done };
  };
  const all = occurrences(fy, p.flags, S.agm[fy]).map(row);
  const around = [...occurrences(fy - 1, p.flags, S.agm[fy - 1]), ...occurrences(fy, p.flags, S.agm[fy]), ...occurrences(fy + 1, p.flags, S.agm[fy + 1])]
    .filter((o) => Math.abs(daysBetween(today, o.due)) <= 60).map(row);
  const seen = new Set();
  const coming = around.filter((r) => ["overdue", "today", "soon", "upcoming"].includes(r.status) && !seen.has(r.key) && seen.add(r.key));
  return { all, coming, since, today };
}

async function docText(id) {

let allTextLoaded = false;

  const q = await cap.db.collection("libtext").get();
  q.docs.forEach((d) => { const t = d.data(); textCache.set(d.id, { v: t.v, text: t.text || "", status: t.status || "none" }); });

function words(q) { return (String(q).toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}\-\/.]*/gu) || []).filter((w) => w.length > 1 || /\d/.test(w)).slice(0, 12); }
function snippetFor(text, ws) {
  const low = text.toLowerCase();
  let at = -1;
  for (const w of ws) { const i = low.indexOf(w); if (i >= 0 && (at < 0 || i < at)) at = i; }
  if (at < 0) return "";
  const start = Math.max(0, at - 90), end = Math.min(text.length, at + 160);
  let s = (start ? "… " : "") + text.slice(start, end).replace(/\s+/g, " ") + (end < text.length ? " …" : "");
  for (const w of ws) s = s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&"), "gi"), (m) => `«${m}»`);
  return s;
}
/** Search titles, notes, key words and (after loading) the text inside documents. */
async function searchLibrary(q, folder = "", { includeText = true, limit = 200 } = {}) {
  const ws = words(q);
  if (!ws.length) return [];
  if (includeText) await loadAllText();
  const score = (d, needAll) => {
    const v = currentVersion(d);
    const fields = [[d.title, 10], [d.description, 4], [d.tags, 4], [(FOLDER[d.folder] || {}).name, 2], [v.filename, 3]];
    const body = (textCache.get(d.id) || {}).text || "";
    let total = 0, hit = 0;
    for (const w of ws) {
      let s = 0;
      for (const [f, wt] of fields) if (f && String(f).toLowerCase().includes(w)) s += wt;
      if (body) { const n = body.toLowerCase().split(w).length - 1; s += Math.min(n, 8); }
      if (s) hit++;
      total += s;
    }
    if (needAll ? hit < ws.length : !hit) return 0;
    return total;
  };
  const pool = liveDocs().filter((d) => !folder || d.folder === folder);
  for (const needAll of [true, false]) {
    const res = pool.map((d) => ({ d, s: score(d, needAll) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, limit);
    if (res.length) {
      return res.map(({ d }) => ({ ...d, snippet: snippetFor((textCache.get(d.id) || {}).text || d.description || "", ws) }));
    }
  }
  return [];
}

/* ================================================================ files */
const EXT_TYPES = {
  pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp",
  txt: "text/plain", md: "text/markdown", csv: "text/csv",
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
};
const NATIVE = new Set(["pdf", "png", "jpg", "jpeg", "webp", "txt", "md", "csv"]);
const extOf = (name) => (String(name).toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || "";

async function pdfDoc(buf) {
  await need("pdf");
  return window.pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
}
async function pdfText(buf) {
  const pdf = await pdfDoc(buf.slice(0));
  const parts = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const t = tc.items.map((x) => x.str + (x.hasEOL ? "\n" : " ")).join("").replace(/[ \t]+\n/g, "\n").trim();
    if (t) parts.push(`[Page ${n}]\n${t}`);
  }
  const text = parts.join("\n\n");
  return { text, pages: pdf.numPages, scanned: text.length < 40 * pdf.numPages / 4 };
}
async function pdfPagesAsImages(buf, max) {
  const pdf = await pdfDoc(buf.slice(0));
  const out = [];
  for (let n = 1; n <= Math.min(pdf.numPages, max); n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    out.push(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85)));
  }
  return out;
}
async function docxText(buf) {
  await need("mammoth");
  const r = await window.mammoth.extractRawText({ arrayBuffer: buf.slice(0) });
  return r.value.replace(/\n{3,}/g, "\n\n").trim();
}

/** Read a file for the assistant: text, or page pictures for scanned copies. */
async function readForAssistant(name, buf) {
  const ext = extOf(name);
  const maxImages = (cap.limits && cap.limits.images && cap.limits.images.maxCount) || 0;
  if (ext === "pdf") {
    const r = await pdfText(buf);
    if (!r.scanned) return { name, text: r.text, summary: `PDF, ${r.pages} page${r.pages > 1 ? "s" : ""}` };
    if (!maxImages) throw new Error(`'${name}' is a scanned copy with no readable text, and pictures cannot be sent from this view. Upload a text PDF or the Word file instead.`);
    const images = await pdfPagesAsImages(buf, maxImages);
    return { name, text: "", images, summary: `Scanned PDF - the first ${images.length} of ${r.pages} page${r.pages > 1 ? "s" : ""} will be read as pictures` };
  }
  if (ext === "docx") { const text = await docxText(buf); return { name, text, summary: `Word document, about ${text.split(/\s+/).length.toLocaleString("en-IN")} words` }; }
  if (["txt", "md", "csv"].includes(ext)) { const text = new TextDecoder().decode(buf); return { name, text, summary: "Text file" }; }
  if (["png", "jpg", "jpeg", "webp"].includes(ext)) {
    if (!maxImages) throw new Error("Pictures cannot be sent to the assistant from this view.");
    return { name, text: "", images: [new Blob([buf], { type: EXT_TYPES[ext] })], summary: "Picture / scan" };
  }
  if (ext === "doc") throw new Error("Old-style Word files (.doc) cannot be read. In Word choose File > Save As > Word Document (.docx) or PDF, then add it again.");
  throw new Error(`'${name}' cannot be read by the assistant. Use a PDF, a Word (.docx) file, a picture or a text file.`);
}

function b64(buf) {
  const u = new Uint8Array(buf); let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function unb64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

/** Stored file bytes for a version (unwrapping Word / Excel / PowerPoint files kept inside JSON). */
async function versionBytes(v) {
  const r = await fetch("/_blob/" + v.asset);
  if (!r.ok) throw new Error("The file could not be found. It may have been removed.");
  if (v.wrapped) { const j = await r.json(); return unb64(j.data); }
  return new Uint8Array(await r.arrayBuffer());
}
async function saveFile(filename, data) {
  if (!cap.downloads) return flash("Downloads are not available in this view.");
  try { await cap.downloads.save({ filename, data }); }
  catch (e) {
    if (e && e.code === "declined") return;
    flash(e && e.code === "rejected_extension" ? "This kind of file cannot be downloaded here." : "The file could not be downloaded. Please try again.");
  }
}

const GROUP_KICKER = { "Board & Shareholders": "GOVERNANCE · COMPANY SECRETARIAT", Contracts: "LEGAL · CONFIDENTIAL",
  "Legal Letters & Disputes": "LEGAL · PRIVILEGED & CONFIDENTIAL", Policies: "POLICY · DRAFT FOR APPROVAL" };

async function wordFile(markdown, title, kind, docType) {
  await need("docx");
  const L = await LKWord.load(window.docx, async (rel) => new Uint8Array(await (await fetch(rel)).arrayBuffer()));
  const dt = DATA.draftTypes.find((d) => d.id === docType);
  let kicker = KIND_KICKER[kind] || KIND_KICKER.draft, pill = null;
  if (kind === "draft" && dt) {
    kicker = GROUP_KICKER[dt.group] || kicker;
    const [dept, code] = DATA.refCodes[docType] || ["LEG", "GEN"];
    pill = `${dt.group === "Contracts" ? "Agreement no." : "Ref."} LHRC/${dept}/${code}/${new Date().getFullYear()}/[NNN]`;
  }
  const { data } = await LKWord.build(L, markdown, {
    title, kicker, pill, footer: KIND_FOOTER[kind] || KIND_FOOTER.draft, company: profile().name,
    status: kind === "draft" ? "Draft for review" : "For internal use",
  }, (doc) => window.docx.Packer.toBlob(doc), window.JSZip);
  const safe = String(title).replace(/[^A-Za-z0-9 _-]+/g, "").trim().replace(/\s+/g, "_").slice(0, 80) || "document";
  return { data, filename: `${safe}_${todayIso()}.docx` };
}

/* =============================================================== assistant */
const toolsOk = () => !!(cap.limits && cap.limits.tools);

function profileBlock() {
  const p = profile();
  const d = new Date();
  const lines = [`Today's date is ${fmtDate(todayIso())} (${d.toLocaleDateString("en-GB", { weekday: "long" })}).`, "", "# Company profile (from Settings)"];
  const labels = { name: "Legal name", brand: "Known as", cin: "CIN", registered_office: "Registered office", company_type: "Type of company",
    parent: "Holding / parent", pan: "PAN", gstin: "GSTIN", fy_end: "Financial year end", cs_name: "Company Secretary", signatory: "Usual signatory", notes: "Other notes" };
  for (const [k, lab] of Object.entries(labels)) if (String(p[k] || "").trim()) lines.push(`- ${lab}: ${String(p[k]).trim()}`);
  for (const [k, lab] of Object.entries(DATA.flags)) if (k !== "track_tax_labour") lines.push(`- ${lab}: ${p.flags[k] ? "Yes" : "No"}`);
  return lines.join("\n");
}

function vetPrompt(form, docNames) {
  const v = DATA.vetTypes.find((x) => x.id === form.type) || DATA.vetTypes[DATA.vetTypes.length - 1];
  const parts = [`Please vet the attached document(s): ${docNames.join(", ") || "pasted text below"}.`, `Type of document: ${v.title}.`,
    `Our side: ${form.role || "Not stated - work it out"}.`, `Pay particular attention to: ${v.focus}`];
  if ((form.concerns || "").trim()) parts.push(`The CS is specifically worried about: ${form.concerns.trim()}`);
  parts.push("Follow the vetting structure in your instructions exactly.");
  return parts.join("\n");
}
function draftPrompt(form, docNames) {
  const d = DATA.draftTypes.find((x) => x.id === form.type) || DATA.draftTypes[DATA.draftTypes.length - 1];
  const lines = [`Please draft: ${d.title}.`, ""];
  for (const [key, label] of [...d.questions, ...DATA.commonQuestions]) {
    const val = String((form.answers || {})[key] || "").trim();
    lines.push(`- ${label}: ${val || "[not given - leave a blank]"}`);
  }
  if (d.guidance) lines.push("", `Guidance for this document: ${d.guidance}`);
  if (docNames.length) lines.push("", `Reference material attached: ${docNames.join(", ")}. Use it where relevant (e.g. follow the other side's draft or our earlier format).`);
  lines.push("", "Write the complete document in Markdown (use # headings, numbered clauses and tables), then the 'Notes for the CS' section.");
  return lines.join("\n");
}

function chunk(text, start) {
  start = Math.max(0, Number(start) || 0);
  const part = cutToBytes(text.slice(start), CHUNK_BYTES);
  const next = start + part.length;
  return { start, text: part, next_start: next < text.length ? next : null, total_chars: text.length };
}

/** Put together what one call to Claude sends: turns within the size cap, plus tools and images. */
function assemble(session) {
  const atts = session.attachments || [];
  const textAtts = atts.filter((a) => a.text);
  const images = atts.flatMap((a) => a.images || []).slice(0, (cap.limits && cap.limits.images && cap.limits.images.maxCount) || 0);
  const libTools = toolsOk() && liveDocs().length > 0;
  const rules = DATA.systemPrompt + "\n\n" + profileBlock();
  const build = (inline, history) => {
    let first = session.first;
    if (textAtts.length && inline) {
      first += "\n\n" + textAtts.map((a) => `<document name="${a.name}">\n${a.text}\n</document>`).join("\n\n");
    } else if (textAtts.length) {
      first += "\n\nThe attached documents are long, so they are not pasted here. Read all of each one with the read_attached tool before answering (ask for several parts at once if you can):\n" +
        textAtts.map((a, i) => `${i + 1}. ${a.name} - ${a.text.length.toLocaleString("en-IN")} characters`).join("\n");
    }
    if (images.length) first += `\n\n${images.length} picture${images.length > 1 ? "s" : ""} of scanned pages ${images.length > 1 ? "are" : "is"} attached; read ${images.length > 1 ? "them" : "it"} as part of the document.`;
    if (libTools) first += `\n\nThe company's document library holds ${liveDocs().length} document${liveDocs().length > 1 ? "s" : ""}; search it with search_library and read documents with read_library_document whenever our own records matter.`;
    return [{ role: "user", content: rules }, { role: "user", content: first }, ...history];
  };
  const size = (turns) => turns.reduce((n, t) => n + bytes(t.content), 0);
  let history = (session.history || []).slice();
  let inline = !toolsOk() || textAtts.reduce((n, a) => n + bytes(a.text), 0) <= INLINE_DOC_BYTES;
  let turns = build(inline, history);
  while (size(turns) > PROMPT_CAP && history.length > 2) { history = history.slice(2); turns = build(inline, history); }
  if (size(turns) > PROMPT_CAP && inline && toolsOk() && textAtts.length) { inline = false; turns = build(inline, history); }
  if (size(turns) > PROMPT_CAP) {
    // Last resort without tools: keep the start of each document.
    const room = Math.max(4000, PROMPT_CAP - size(build(false, history)) - 2000);
    const each = Math.floor(room / Math.max(1, textAtts.length));
    const saved = textAtts.map((a) => a.text);
    textAtts.forEach((a) => { a.text = cutToBytes(a.text, each) + "\n[The rest of this document was too long to include.]"; });
    turns = build(true, history);
    textAtts.forEach((a, i) => { a.text = saved[i]; });
    session.cutShort = true;
  }
  const tools = [];
  const sources = session.sources || (session.sources = {});
  if (!inline && textAtts.length) {
    tools.push({
      name: "read_attached",
      description: "Read one of the documents the user attached to this request, in parts. Returns {document, start, text, next_start, total_chars}; call again with start = next_start until next_start is null.",
      inputSchema: { type: "object", properties: { document: { type: "integer", description: "The document's number in the list (1 = first)." },
        start: { type: "integer", description: "Character position to start from; 0 for the beginning." } }, required: ["document"] },
      execute: async (input) => {
        const a = textAtts[(Number(input.document) || 1) - 1];
        if (!a) throw new Error("There is no document with that number.");
        session.onStatus && session.onStatus(`Reading ${a.name}...`);
        return { document: a.name, ...chunk(a.text, input.start) };
      },
    });
  }
  if (libTools) {
    tools.push({
      name: "search_library",
      description: "Search the company's own document library (MOA/AOA, Board and general meeting papers and minutes, registers, filed MCA forms, policies, executed contracts, licences, FEMA filings, litigation papers, templates, opinions). Returns up to 8 matches with a short extract.",
      inputSchema: { type: "object", properties: { query: { type: "string", description: "Key words, e.g. 'quorum board meeting articles'" },
        folder: { type: "string", enum: DATA.folders.map((f) => f.id), description: "Optional folder to search in." } }, required: ["query"] },
      execute: async (input) => {
        const q = String(input.query || "").trim();
        if (!q) throw new Error("Give some key words to search for.");
        session.onStatus && session.onStatus(`Searching the library for "${q.slice(0, 60)}"...`);
        const hits = await searchLibrary(q, FOLDER[input.folder] ? input.folder : "", { limit: 8 });
        if (!hits.length) return { results: [], note: "No matching documents." };
        return { results: hits.map((d) => ({ doc_id: d.id, title: d.title, folder: (FOLDER[d.folder] || {}).name, date: d.date || null,
          version: d.current, extract: (d.snippet || "").replace(/[«»]/g, "") })) };
      },
    });
    tools.push({
      name: "read_library_document",
      description: "Read the text of one library document (its current version) in parts. Returns {title, folder, date, version, start, text, next_start, total_chars}; call again with start = next_start to continue.",
      inputSchema: { type: "object", properties: { doc_id: { type: "string", description: "The doc_id from search_library." },
        start: { type: "integer", description: "Character position to start from; 0 for the beginning." } }, required: ["doc_id"] },
      execute: async (input) => {
        const d = liveDocs().find((x) => x.id === String(input.doc_id));
        if (!d) throw new Error("No such document in the library.");
        session.onStatus && session.onStatus(`Reading "${d.title.slice(0, 60)}" from the library...`);
        const t = await docText(d.id);
        sources["doc-" + d.id] = d.title;
        const out = { title: d.title, folder: (FOLDER[d.folder] || {}).name, date: d.date || null, version: d.current, ...chunk(t.text, input.start) };
        if (!t.text) out.note = "This document has no readable text (a scanned copy, picture or spreadsheet). Tell the user to open it in the library and use 'Ask about this document'.";
        return out;
      },
    });
  }
  return { turns, tools, images };
}

  sampling_disabled: "The assistant is not available for your claude.ai account.",
  not_declared: "The assistant is not available on this version of the page.",
  capability_disabled: "The assistant is not available in this view.",
  capability_removed: "The assistant is not available in this view.",
  rate_limited: "You have asked a lot in a short time, or reached your usage limit. Wait a little and press the button again.",
  session_expired: "Your claude.ai session has ended. Sign in again, then try once more.",
  prompt_too_large: "This is too long to send in one go. Attach fewer or shorter documents (for example the agreement without its annexures).",
  refused: "The assistant declined this request. Rephrase it, or remove any unusual content, and try again.",
