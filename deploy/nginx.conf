# Example reverse proxy for the CS Assistant on the hospital intranet.
# Replace cs.lakeshore.internal and the certificate paths with your own.
server {
    listen 80;
    server_name cs.lakeshore.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cs.lakeshore.internal;

    ssl_certificate     /etc/ssl/certs/cs.lakeshore.internal.crt;
    ssl_certificate_key /etc/ssl/private/cs.lakeshore.internal.key;

    client_max_body_size 120m;          # library uploads

    # Optional: only allow the hospital network.
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers stream word by word; do not buffer them.
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
